<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Garage</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background:#f4f6f8; margin:0; padding:20px; display:flex; justify-content:center; }
    .container { width:420px; background:#fff; border-radius:15px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
    .header { background:#00C853; color:#fff; padding:15px; text-align:center; }
    .section { padding:15px; border-bottom:1px solid #eee; }
    input { padding:10px; width:70%; border:1px solid #ddd; border-radius:5px; }
    button { padding:10px; background:#333; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    .car-item { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#fff; border:1px solid #eee; margin-bottom:8px; border-radius:8px; gap:10px; }
    .active-car { border:2px solid #00C853; background:#e8f5e9; }
    .badge { background:#00C853; color:#fff; font-size:10px; padding:3px 6px; border-radius:4px; margin-left:8px; }
    .add-btn { background:#007bff; font-size:12px; padding:6px 10px; }
    .danger { background:#ef4444; font-size:12px; padding:6px 10px; }
    small { color:#666; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>My Garage 🚗</h2>
    <small id="who"></small>
  </div>

  <div class="section">
    <div style="display:flex; gap:5px;">
      <input type="text" id="search" placeholder="Search (e.g. Tesla Model 3)" />
      <button id="findBtn" onclick="searchCar()">Find</button>
    </div>
    <div id="results" style="margin-top:10px;"></div>
  </div>

  <div class="section" style="background:#fafafa;">
    <h4 style="margin-top:0;">Your Cars</h4>
    <div id="garageList">Loading...</div>
  </div>
</div>

<script>
  // ✅ Must be logged in
  const user = JSON.parse(localStorage.getItem("currentUser") || "null");
  if (!user || !user.id) window.location.href = "login.html";
  document.getElementById("who").innerText = user.email;

  // ✅ Update this if your project folder is different
  const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/api/GARAGE";
  const USER_ID = user.id;

  async function postJSON(url, payload) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    const text = await res.text(); // always read raw
    let data = null;
    try { data = JSON.parse(text); }
    catch {
      console.error("NOT JSON:", url, "Status:", res.status, "RAW:", text);
      throw new Error("Backend did not return JSON (check PHP error / wrong URL).");
    }
    if (!res.ok) {
      throw new Error(data.error || ("HTTP " + res.status));
    }
    return data;
  }

  async function loadGarage() {
    const list = document.getElementById("garageList");
    list.innerHTML = "Loading...";
    try {
      const data = await postJSON(`${API_URL}/list.php`, { user_id: USER_ID });
      list.innerHTML = "";

      if (!data.cars || data.cars.length === 0) {
        list.innerHTML = "<small>No cars yet. Search above to add one!</small>";
        return;
      }

      data.cars.forEach((car) => {
        const isActive = Number(car.is_active) === 1;
        const label = `${car.brand_name} ${car.model_name} ${car.variant_name || ""}`.trim();

        const div = document.createElement("div");
        div.className = "car-item " + (isActive ? "active-car" : "");
        div.innerHTML = `
          <div style="flex:1;">
            <strong>${label}</strong>
            ${isActive ? '<span class="badge">ACTIVE</span>' : ''}
            <div><small>${car.battery_capacity_kwh} kWh • ${car.efficiency_wh_per_km} Wh/km</small></div>
            ${car.nickname ? `<div><small>Nickname: ${car.nickname}</small></div>` : ""}
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            ${!isActive ? `<button class="add-btn" onclick="setActive(${car.garage_id})">Select</button>` : ""}
            <button class="danger" onclick="removeCar(${car.garage_id})">Del</button>
          </div>
        `;
        list.appendChild(div);
      });
    } catch (e) {
      console.error(e);
      list.innerHTML = `<small style="color:#dc2626;">${e.message}</small>`;
    }
  }

  async function searchCar() {
    const q = document.getElementById("search").value.trim();
    const results = document.getElementById("results");
    const btn = document.getElementById("findBtn");

    if (!q) { results.innerHTML = "<small>Type something to search.</small>"; return; }

    btn.disabled = true;
    btn.innerText = "...";
    results.innerHTML = "";

    try {
      const data = await postJSON(`${API_URL}/garage_search.php`, { search: q });

      if (!data.results || data.results.length === 0) {
        results.innerHTML = "<small>No results found in your EV master list.</small>";
        return;
      }

      data.results.slice(0, 10).forEach((r) => {
        const label = `${r.brand_name} ${r.model_name} ${r.variant_name || ""}`.trim();
        const row = document.createElement("div");
        row.className = "car-item";
        row.innerHTML = `
          <div style="flex:1;">
            <strong>${label}</strong>
            <div><small>${r.battery_capacity_kwh} kWh • ${r.efficiency_wh_per_km} Wh/km</small></div>
          </div>
          <button class="add-btn" onclick="addCar(${r.variant_id})">Add</button>
        `;
        results.appendChild(row);
      });
    } catch (e) {
      console.error(e);
      results.innerHTML = `<small style="color:#dc2626;">${e.message}</small>`;
    } finally {
      btn.disabled = false;
      btn.innerText = "Find";
    }
  }

  async function addCar(variantId) {
    const nickname = prompt("Nickname (optional):") || "";
    try {
      const data = await postJSON(`${API_URL}/add.php`, {
        user_id: USER_ID,
        variant_id: Number(variantId),
        nickname
      });
      document.getElementById("results").innerHTML = "";
      document.getElementById("search").value = "";
      await loadGarage();
    } catch (e) {
      alert(e.message);
    }
  }

  async function setActive(garageId) {
    try {
      await postJSON(`${API_URL}/set_active.php`, {
        user_id: USER_ID,
        garage_id: Number(garageId)
      });
      await loadGarage();
    } catch (e) {
      alert(e.message);
    }
  }

  async function removeCar(garageId) {
    if (!confirm("Delete this vehicle?")) return;
    try {
      await postJSON(`${API_URL}/remove.php`, {
        user_id: USER_ID,
        garage_id: Number(garageId)
      });
      await loadGarage();
    } catch (e) {
      alert(e.message);
    }
  }

  loadGarage();
</script>

</body>
</html>
