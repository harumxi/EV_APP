<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Preview Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Premium Glassmorphism Tokens */
        .glass-card {
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 40px 60px -12px rgba(0, 0, 0, 0.08);
        }
        
        /* Inset Viewer Frame */
        .viewer-inset {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Soft Vignette for Background */
        .bg-vignette {
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.03) 100%);
        }
    </style>
</head>
<body class="h-screen w-full bg-gradient-to-br from-teal-50 via-slate-100 to-blue-100 flex items-center justify-center overflow-hidden relative">

    <!-- Subtle Vignette Overlay -->
    <div class="absolute inset-0 bg-vignette pointer-events-none"></div>

    <!-- Main Glass Card -->
    <div class="glass-card w-[900px] h-[580px] rounded-[24px] p-6 flex flex-col relative z-10">
        
        <!-- Header Area -->
        <div class="flex justify-between items-start mb-5">
            <div>
                <h2 class="text-xl font-bold text-[#111827] tracking-tight">Vehicle preview</h2>
                <p class="text-xs text-[#6B7280] mt-1 font-medium tracking-wide">Drag to rotate • Scroll to zoom</p>
            </div>
            <!-- Live Badge -->
            <div class="px-3 py-1 rounded-full bg-white/40 border border-white/60 text-[11px] font-semibold text-[#111827] shadow-sm backdrop-blur-md">
                Live
            </div>
        </div>

        <!-- Viewer Window (3D Canvas Area) -->
        <div class="viewer-inset flex-1 rounded-[20px] relative flex items-center justify-center overflow-hidden">
            <!-- Static Car Render -->
            <img src="https://pngimg.com/uploads/tesla_car/tesla_car_PNG46.png" 
                 alt="Tesla Model 3 Render" 
                 class="w-[85%] h-auto object-contain drop-shadow-2xl opacity-95 transform translate-y-6 translate-x-2"
                 style="filter: drop-shadow(0 30px 30px rgba(0,0,0,0.18));">
        </div>

        <!-- Bottom Element: Progress Bar -->
        <div class="mt-6 px-1">
            <div class="h-1.5 w-full bg-black/5 rounded-full overflow-hidden">
                <div class="h-full w-[35%] bg-teal-600/70 rounded-full"></div>
            </div>
        </div>

    </div>

</body>
</html>
