<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Navigation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0f172a; }
        #map { height: 100vh; width: 100vw; z-index: 0; }

        /* Dashboard Overlay */
        .dashboard {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            border-radius: 24px; padding: 20px; color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); z-index: 1000;
            display: flex; gap: 20px; align-items: center; border: 1px solid rgba(255,255,255,0.1);
        }

        /* Speedometer */
        .speed-circle {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid #3b82f6;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(59, 130, 246, 0.1);
        }

        /* Battery Bar */
        .battery-track { width: 100%; height: 10px; background: #374151; border-radius: 99px; margin-top: 8px; overflow: hidden;}
        .battery-fill { height: 100%; transition: width 0.3s ease, background 0.3s; }

        /* Navigation Arrow */
        .nav-icon { transition: transform 0.2s linear; }
        .nav-arrow {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 30px solid #3b82f6;
            filter: drop-shadow(0 0 8px #2563eb);
            transform-origin: center center;
        }
        
        /* Modals */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-bg.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="absolute top-4 left-4 right-4 z-[1000] flex justify-between items-start pointer-events-none">
        <div class="bg-black/80 text-white backdrop-blur px-6 py-4 rounded-2xl shadow-2xl pointer-events-auto border-l-4 border-green-500">
            <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">Navigation</div>
            <div class="text-2xl font-black flex items-center gap-3">
                <span class="text-4xl">⬆</span> 
                <span id="instruction">Head North</span>
            </div>
        </div>
        <button onclick="stopSimulation()" class="pointer-events-auto bg-red-600/90 hover:bg-red-600 text-white font-bold px-5 py-3 rounded-xl shadow-lg backdrop-blur transition">
            Exit
        </button>
    </div>

    <div class="dashboard">
        <div class="speed-circle">
            <div class="text-2xl font-black" id="speedDisplay">0</div>
            <div class="text-[10px] text-blue-200 font-bold">km/h</div>
        </div>
        <div class="flex-1">
            <div class="flex justify-between items-end mb-1">
                <div>
                    <div class="text-xs text-gray-400 font-bold uppercase">Battery</div>
                    <div class="text-xl font-black text-white" id="battDisplay">--%</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-gray-400 font-bold uppercase">Remaining</div>
                    <div class="text-xl font-black text-white"><span id="distDisplay">--</span> km</div>
                </div>
            </div>
            <div class="battery-track">
                <div class="battery-fill bg-green-500" id="battBar" style="width: 80%"></div>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal-bg">
        <div class="bg-white rounded-3xl p-8 w-[90%] max-w-sm text-center shadow-2xl transform scale-100 transition-all border-4 border-red-100">
            <div class="text-6xl mb-4 animate-bounce">⚠️</div>
            <h2 class="text-3xl font-black text-gray-900 mb-2">Low Battery!</h2>
            <p class="text-gray-600 mb-6 font-medium text-lg">Battery is below 20%.<br>We found a charging hub nearby.</p>
            <button onclick="rerouteToCharger()" class="w-full py-4 rounded-xl bg-green-600 text-white text-lg font-black shadow-xl hover:bg-green-700 transition transform active:scale-95">
                ⚡ Reroute to Charger
            </button>
            <button onclick="closeAlert()" class="mt-3 text-gray-400 text-sm font-bold hover:text-gray-600">Dismiss (Risky)</button>
        </div>
    </div>

    <div id="summaryModal" class="modal-bg">
        <div class="bg-white rounded-3xl p-8 w-[90%] max-w-sm text-center shadow-2xl">
            <div class="text-6xl mb-4">🏁</div>
            <h2 class="text-3xl font-black text-gray-900 mb-1">Trip Complete</h2>
            <p class="text-gray-500 font-bold mb-6 text-sm uppercase tracking-wide">Summary Report</p>
            <div class="grid grid-cols-2 gap-4 mb-6 text-left bg-gray-50 p-4 rounded-2xl">
                <div>
                    <div class="text-xs text-gray-500 font-bold">DISTANCE</div>
                    <div class="text-xl font-black text-gray-800" id="sumDist">0 km</div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 font-bold">BATTERY USED</div>
                    <div class="text-xl font-black text-blue-600" id="sumBatt">0%</div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 font-bold">TIME</div>
                    <div class="text-xl font-black text-gray-800" id="sumTime">0 min</div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 font-bold">CO2 SAVED</div>
                    <div class="text-xl font-black text-green-600" id="sumCo2">0 kg</div>
                </div>
            </div>
            <button onclick="window.location.href='trip_planner.html'" class="w-full py-4 rounded-xl bg-gray-900 text-white text-lg font-black shadow-xl hover:bg-black transition">
                Done
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/polyline@1.2.0/src/polyline.js"></script>

    <script>
        // 1. DATA LOADING
        const activeTrip = JSON.parse(localStorage.getItem("activeTrip"));
        if (!activeTrip) {
            alert("No active trip found.");
            window.location.href = "trip_planner.html";
        }

        // 2. REALISTIC MAP SETUP
        const map = L.map('map', { zoomControl: false }).setView([14.5995, 120.9842], 18);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 19
        }).addTo(map);

        // 3. DRAW ROUTE
        const routePoints = polyline.decode(activeTrip.route.geometry);
        const pathLine = L.polyline(routePoints, { color: '#3b82f6', weight: 10, opacity: 0.6 }).addTo(map);
        
        const pinIcon = L.divIcon({className:'', html:'<div style="background:white;width:12px;height:12px;border-radius:50%;"></div>'});
        L.marker(routePoints[0], {icon:pinIcon}).addTo(map);
        L.marker(routePoints[routePoints.length-1], {icon:pinIcon}).addTo(map);

        // 4. THE CAR MARKER
        const carIcon = L.divIcon({
            className: 'nav-icon',
            html: `<div id="carArrow" class="nav-arrow"></div>`,
            iconSize: [40, 40], iconAnchor: [20, 20] 
        });
        const carMarker = L.marker(routePoints[0], {icon: carIcon, zIndexOffset: 1000}).addTo(map);

        // 5. ACCURATE SIMULATION ENGINE
        let step = 0;
        let isPaused = false;
        let hasAlerted = false;

        // --- ACCURACY LOGIC ---
        // We calculate start battery from the route data: End + Usage = Start
        const routeData = activeTrip.route;
        const totalDistKm = routeData.distance_km;
        const totalTimeMin = routeData.duration_min;
        const totalUsage = routeData.est_usage || 20; // Default to 20 if missing
        
        // This is the REAL starting battery you entered in the planner
        const realStartBattery = parseFloat(routeData.end_battery) + parseFloat(totalUsage);
        
        let currentBattery = realStartBattery;
        
        // Calculate exact drain per step based on total estimated usage
        const drainPerStep = totalUsage / routePoints.length;

        const timer = setInterval(() => {
            if (isPaused || step >= routePoints.length) {
                if(step >= routePoints.length) finishTrip();
                return;
            }

            // Move Car
            const loc = routePoints[step];
            carMarker.setLatLng(loc);
            map.setView(loc, 18, { animate: true, duration: 0.5 });

            if (step < routePoints.length - 1) {
                const next = routePoints[step + 1];
                const angle = getAngle(loc, next);
                const arrow = document.getElementById('carArrow');
                if(arrow) arrow.style.transform = `rotate(${angle}deg)`;
            }

            // Update Battery (Accurate Drain)
            currentBattery -= drainPerStep;
            updateDash(step, routePoints.length, currentBattery);

            // CHECK ALERT: Only trigger if battery ACTUALLY drops below 20%
            if (currentBattery < 20.0 && !hasAlerted) {
                isPaused = true;
                hasAlerted = true;
                document.getElementById('alertModal').classList.add('show');
            }

            step++;
        }, 100); // Speed: 100ms per step (Fast Forward)

        function updateDash(currentStep, totalSteps, batt) {
            const progress = currentStep / totalSteps;
            const distLeft = (totalDistKm * (1 - progress)).toFixed(1);
            
            // Speed Variance
            const speed = Math.floor(Math.random() * (60 - 40 + 1) + 40);
            document.getElementById('speedDisplay').innerText = speed;
            document.getElementById('distDisplay').innerText = distLeft;
            
            const b = batt.toFixed(1);
            document.getElementById('battDisplay').innerText = b + '%';
            const bar = document.getElementById('battBar');
            bar.style.width = b + '%';

            if(b < 20) { bar.className = "battery-fill bg-red-500 animate-pulse"; }
            else if(b < 40) { bar.className = "battery-fill bg-yellow-400"; }
            else { bar.className = "battery-fill bg-green-500"; }
        }

        function rerouteToCharger() {
            document.getElementById('alertModal').classList.remove('show');
            const currentLoc = carMarker.getLatLng();
            const chargerLoc = [currentLoc.lat + 0.0005, currentLoc.lng + 0.0005];
            const chargerIcon = L.divIcon({html:'<div style="font-size:30px;">⚡</div>', className:''});
            L.marker(chargerLoc, {icon:chargerIcon}).addTo(map).bindPopup("Fast Charger").openPopup();
            alert("Rerouting to nearest charger...");
            isPaused = false;
        }

        function closeAlert() {
            document.getElementById('alertModal').classList.remove('show');
            isPaused = false;
        }

        function finishTrip() {
            clearInterval(timer);
            const usedBattery = (realStartBattery - currentBattery).toFixed(1);
            const co2Saved = (totalDistKm * 0.12).toFixed(2);
            
            document.getElementById('sumDist').innerText = totalDistKm + " km";
            document.getElementById('sumBatt').innerText = usedBattery + "%"; 
            document.getElementById('sumTime').innerText = totalTimeMin + " min";
            document.getElementById('sumCo2').innerText = co2Saved + " kg";
            document.getElementById('summaryModal').classList.add('show');
        }

        function stopSimulation() {
            window.location.href = "trip_planner.html";
        }

        function getAngle(start, end) {
            const dy = end[0] - start[0];
            const dx = Math.cos(Math.PI/180 * start[0]) * (end[1] - start[1]);
            const theta = Math.atan2(dy, dx);
            return (theta * 180 / Math.PI) * -1 + 90;
        }
    </script>
</body>
</html>
