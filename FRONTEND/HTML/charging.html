<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency Charging</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts + Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/trip_planner.css" />

    <style>
        /* Hide scrollbar for clean panel */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Adapt Charging specific elements to Trip Planner Theme */
        .station-card {
            background: rgba(255,255,255,0.98);
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(0,0,0,0.10);
            cursor: pointer;
            transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
            margin-bottom: 8px;
        }
        .station-card:hover {
            transform: translateY(-1px);
            background: rgba(0,0,0,0.02);
            border-color: rgba(0,0,0,0.14);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.06);
        }
        .station-card.selected {
            background: rgba(0,0,0,0.03);
            border-color: rgba(0,0,0,0.18);
            box-shadow: 0 10px 24px rgba(0,0,0,0.08), 0 0 0 2px rgba(0,0,0,0.12);
        }
        .station-card.disabled { opacity: 0.6; filter: grayscale(1); }

        .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 4px; height: 20px; }
        .badge-green { background: #ecfdf5; color: #15803d; border: 1px solid #bbf7d0; }
        .badge-gold { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }

        /* Modal Styles from original charging.html adapted */
        .modal-bg {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-bg.active { opacity: 1; pointer-events: all; }
        
        .success-card {
            background: white; width: 90%; max-width: 400px;
            border-radius: 24px; padding: 32px;
            text-align: center; transform: scale(0.95); transition: transform 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .modal-bg.active .success-card { transform: scale(1); }

        .nav-overlay {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: #111827; color: white; padding: 10px 20px;
            border-radius: 99px; font-weight: 700; z-index: 4000;
            display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            font-size: 14px;
        }

        /* Battery Ring Overrides for Charging Page */
        .battery-ring-wrap { padding-bottom: 0; }
        .battery-stats { margin-top: 12px; }

        /* Mobile Compact Overrides */
        @media (max-width: 768px) {
            .station-card { padding: 10px 12px; margin-bottom: 6px; }
            .station-card .text-\[15px\] { font-size: 14px !important; }
            .station-card .text-\[16px\] { font-size: 14px !important; }
            .station-card .text-\[12px\] { font-size: 11px !important; }
            .badge { height: 18px; font-size: 9px; padding: 0 6px; }
            .battery-ring { width: 140px !important; height: 140px !important; }
            .bat-display { font-size: 32px !important; }
        }
    </style>
</head>

<body>

      <div class="text-2xl font-bold text-gray-900 tracking-tight">Emergency Charging</div>
      
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">

  <div class="app-shell">

    <aside id="panel" class="side-panel !bg-white/50 !backdrop-blur-[20px] !border !border-white/40 !shadow-xl !rounded-[28px] overflow-hidden flex flex-col transition-transform duration-300 !p-0">

      <div class="panel-top flex items-center justify-between gap-3 px-4 pt-4 pb-2 md:px-5 md:pt-5 md:pb-3 border-b border-black/5 shrink-0">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='trip_planner.html'" class="p-1 -ml-1 rounded-full hover:bg-black/5 transition text-gray-600">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h3 id="panel-title" class="text-lg font-bold text-gray-900 tracking-tight">Status</h3>
        </div>
        <div class="mode-pill" style="background:#fee2e2; color:#991b1b;">Emergency</div>
      </div>

      <div class="panel-scroll no-scrollbar px-4 pb-20 space-y-3 md:px-5 md:pb-4 md:space-y-4" id="panel-scroll">
        <!-- Battery Ring (Copied from Trip Planner) -->
        <section class="battery-input-box !bg-transparent !border-0 !p-0 flex flex-col items-center justify-center py-1 md:py-2" id="battery-box">
          <div class="battery-ring-wrap !p-0">
            <div class="battery-ring" aria-label="Battery level">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-progress" cx="60" cy="60" r="52"></circle>
              </svg>

              <div class="ring-center">
                <i data-lucide="zap" class="ring-icon"></i>
                <div class="ring-value">
                  <span id="bat-display" class="bat-display">15</span>
                  <span class="ring-percent">%</span>
                </div>
              </div>
            </div>
          </div>

          <div class="battery-input-row">
            <!-- ID matches charging.js logic -->
            <input id="battery_level" type="number" min="1" max="100" inputmode="numeric" aria-label="Battery percentage" value="15" oninput="updateBatteryLevel(this.value)" disabled class="bg-transparent border-none text-center font-bold text-xl w-full text-gray-900 cursor-not-allowed" />
          </div>

          <div class="battery-stats">
            <div class="stat-item"><span>Safe Range</span><strong id="current-range-display">-- km</strong></div>
          </div>
          
          <button onclick="switchToHomeCharging()" class="mt-3 w-full py-2.5 md:py-3 rounded-[16px] border border-red-200 bg-red-50/50 text-red-600 font-bold text-xs uppercase tracking-wide hover:bg-red-100/80 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-house-chimney"></i> Charge at Home
          </button>
        </section>

        <!-- Content Area for Stations -->
        <div id="content-area" class="mt-2 space-y-2">
            <div class="flex flex-col h-full justify-center items-center text-gray-400">
                <i class="fa-solid fa-satellite-dish fa-spin text-3xl mb-3"></i>
                <p class="font-bold text-sm">Finding best chargers...</p>
            </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Finish Modal -->
  <div id="finish-modal" class="modal-bg">
    <div class="success-card">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-flag-checkered text-2xl text-green-600"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-900 mb-2">Trip Finished!</h2>
        <p class="text-gray-500 mb-6 text-sm">
            You have reached the station and recharged your EV.
        </p>
        <div class="bg-gray-50 rounded-xl p-4 mb-6 flex justify-between items-center border border-gray-100">
            <div class="text-left">
                <div class="text-[10px] font-bold text-gray-400 uppercase">New Battery</div>
                <div class="text-xl font-black text-gray-800" id="modal-final-batt">--%</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] font-bold text-gray-400 uppercase">Status</div>
                <div class="text-green-600 font-bold text-sm"><i class="fa-solid fa-check-circle"></i> Ready</div>
            </div>
        </div>
        <button onclick="exitToPlanner()" class="w-full py-3 bg-gray-900 hover:bg-black text-white rounded-xl font-bold text-sm shadow-lg transition">
            Continue Journey
        </button>
    </div>
  </div>

    <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // UI Helper for Battery Ring (Ported from trip_planner.js logic for UI consistency)
    function updateRingUI(percent) {
        const ringProgress = document.querySelector(".ring-progress");
        const batDisplay = document.getElementById("bat-display");
        const RING_R = 52;
        const CIRC = 2 * Math.PI * RING_R;
        
        if(ringProgress) {
            ringProgress.style.strokeDasharray = `${CIRC}`;
            const p = Math.max(0, Math.min(100, Number(percent)));
            const offset = CIRC * (1 - p / 100);
            ringProgress.style.strokeDashoffset = `${offset}`;
        }
        if(batDisplay) batDisplay.textContent = percent;
    }

    // Mobile Sheet Logic
    const panel = document.getElementById("panel");
    const sheetHandle = document.getElementById("sheet-handle");
    function isMobile() { return window.matchMedia("(max-width: 980px)").matches; }
    if (sheetHandle) sheetHandle.addEventListener("click", () => { if (isMobile()) panel.classList.toggle("closed"); });
  </script>

  <!-- Original Backend Logic -->
  <script>
        const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/API/CHARGING/nearby.php";
        
        const activeCar = JSON.parse(localStorage.getItem('active_car') || "{}");
        const CAR_SPECS = {
            capacity: parseFloat(localStorage.getItem('ev_capacity')) || (activeCar.battery_kwh ? parseFloat(activeCar.battery_kwh) : 60.0),
            efficiency: parseInt(localStorage.getItem('ev_efficiency')) || (activeCar.efficiency_whkm ? parseInt(activeCar.efficiency_whkm) : 160), 
            safety_buffer: 0.85 
        };

        let map, userLat, userLng, currentBattery;
        let selectedStation = null;
        let routePolyline = null;
        let carMarker = null;
        let animationFrameId = null;
        let cachedStations = [];
        let processedStationsList = []; // New Global Array to hold processed data
        
        // UNIT PREFERENCES
        const PREF_UNIT = localStorage.getItem('pref_units') || 'KM';
        const DIST_FACTOR = PREF_UNIT === 'MILES' ? 0.621371 : 1;
        const DIST_LABEL = PREF_UNIT === 'MILES' ? 'mi' : 'km';

        const userIcon = L.divIcon({ html: '<div style="width:16px; height:16px; background:#3b82f6; border:3px solid white; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>', className: '' });
        const chargerIcon = L.divIcon({ html: '<div style="font-size:32px; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4)); cursor: pointer;">⚡</div>', className: '', iconSize: [30, 40], iconAnchor: [15, 40] });
        const carIcon = L.divIcon({ html: '<div style="font-size:30px; transform: rotate(0deg); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🚗</div>', className: 'car-marker', iconSize: [30, 30], iconAnchor: [15, 15] });

        document.addEventListener("DOMContentLoaded", () => {
            let savedBatt = localStorage.getItem('user_battery_level') || localStorage.getItem('last_known_battery');
            currentBattery = savedBatt ? parseInt(savedBatt) : 15;

            // Populate Header
            const headerUser = document.getElementById('header-user-name');
            const headerCar = document.getElementById('header-car-name');
            if(headerUser) headerUser.textContent = localStorage.getItem('full_display_name') || 'User';
            if(headerCar && activeCar.brand) headerCar.textContent = `${activeCar.brand} ${activeCar.model}`;

            document.getElementById('battery_level').value = currentBattery;
            updateRingUI(currentBattery); // Init Ring UI
            
            if (localStorage.getItem('ev_charging_mode') === 'home') {
                const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
                map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([14.5995, 120.9842], 13);
                switchToHomeCharging();
            } else {
                initMap();
            }
        });

        function calculateSafeRange(batteryPercent) {
            const remainingKwh = CAR_SPECS.capacity * (batteryPercent / 100);
            const theoreticalRange = (remainingKwh * 1000) / CAR_SPECS.efficiency;
            return theoreticalRange * CAR_SPECS.safety_buffer;
        }

        function updateBatteryLevel(val) {
            currentBattery = parseInt(val);
            if(currentBattery < 1) currentBattery = 1;
            if(currentBattery > 100) currentBattery = 100;
            
            updateRingUI(currentBattery); // Update Ring UI
            
            if(cachedStations && cachedStations.length > 0) renderStationList(cachedStations);
        }

        function initMap() {
            const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

            map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([14.5995, 120.9842], 13);
            L.control.layers({ "Street View": streetLayer, "Satellite View": satelliteLayer }).addTo(map);
            
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    L.marker([userLat, userLng], {icon: userIcon}).addTo(map);
                    map.setView([userLat, userLng], 14);
                    fetchAndFilterStations();
                }, () => {
                    userLat = 14.5995; userLng = 120.9842;
                    fetchAndFilterStations();
                });
            }
        }

        async function fetchAndFilterStations() {
            try {
                const res = await fetch(`${API_URL}?lat=${userLat}&lon=${userLng}`);
                cachedStations = await res.json(); 
                
                cachedStations = cachedStations.map(st => ({
                    ...st,
                    rating: (Math.random() * (5.0 - 3.5) + 3.5).toFixed(1),
                    reviews: Math.floor(Math.random() * 200) + 10
                }));

                if(cachedStations.length === 0) {
                    document.getElementById('content-area').innerHTML = `<div class="text-center p-4 text-red-500 font-bold">No stations found.</div>`;
                    return;
                }
                renderStationList(cachedStations);
            } catch(e) { console.error(e); }
        }

        function renderStationList(stations) {
            if (!userLat || !userLng) return; // Prevent crash if location not ready

            const safeRange = calculateSafeRange(currentBattery);
            document.getElementById('current-range-display').innerText = (safeRange * DIST_FACTOR).toFixed(1) + " " + DIST_LABEL;

            const container = document.getElementById('content-area');
            
            // Populate Global Array with processing
            processedStationsList = stations.map(st => {
                const dist = getDistance(userLat, userLng, st.location.latitude, st.location.longitude);
                return { ...st, distance: dist, reachable: dist <= safeRange };
            });

            // Sorting
            processedStationsList.sort((a, b) => {
                if (a.reachable !== b.reachable) return b.reachable - a.reachable;
                return a.distance - b.distance;
            });

            let html = `<div class="mb-2 flex justify-between items-end px-1">
                            <span class="text-xs font-bold text-gray-400 uppercase">Best Stations</span>
                            <span class="text-xs text-blue-500 font-bold"><i class="fa-solid fa-sort-amount-down"></i> Nearest Reachable</span>
                        </div>`;
            
            let hasReachable = false;

            processedStationsList.forEach((st, index) => {
                if(st.reachable) hasReachable = true;

                const statusClass = st.reachable 
                    ? 'border-l-[3px] border-l-emerald-500 hover:bg-emerald-50/30' 
                    : 'disabled border-l-[3px] border-l-gray-300';
                
                let badgesHtml = '';
                if (st.reachable) {
                    if (index < 3) {
                        badgesHtml += `<span class="badge badge-green"><i class="fa-solid fa-thumbs-up text-[9px]"></i> Rec</span>`;
                    } else if (st.rating >= 4.7) {
                        badgesHtml += `<span class="badge badge-gold"><i class="fa-solid fa-trophy text-[9px]"></i> Top</span>`;
                    }
                }
                
                // --- FIX: Pass INDEX to selectStation instead of Object ---
                html += `
                    <div class="station-card ${statusClass}" onclick="selectStation(${index})">
                        <div class="flex justify-between items-start gap-3">
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-2 flex-wrap mb-0.5">
                                    <div class="font-bold text-[15px] text-gray-900 leading-tight truncate max-w-full">${st.name}</div>
                                    ${badgesHtml}
                                </div>
                                <div class="text-[12px] font-medium text-gray-500 truncate">${st.address.town || 'Unknown'}</div>
                                <div class="text-[11px] font-bold text-yellow-500 mt-1 flex items-center gap-1">
                                    <i class="fa-solid fa-star text-[10px]"></i> ${st.rating} <span class="text-gray-400 font-medium">(${st.reviews})</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0 flex flex-col items-end gap-0.5">
                                <div class="font-bold text-[16px] text-gray-900 tracking-tight">${(st.distance * DIST_FACTOR).toFixed(1)} <span class="text-[12px] font-semibold text-gray-500">${DIST_LABEL}</span></div>
                                ${st.reachable 
                                    ? `<span class="text-emerald-600 text-[10px] font-bold tracking-wide border border-emerald-200 px-1.5 py-0.5 rounded bg-emerald-50">REACHABLE</span>` 
                                    : `<span class="text-gray-400 text-[10px] font-bold tracking-wide border border-gray-200 px-1.5 py-0.5 rounded bg-gray-50">TOO FAR</span>`}
                            </div>
                        </div>
                    </div>`;
                
                const marker = L.marker([st.location.latitude, st.location.longitude], {
                    icon: chargerIcon, 
                    opacity: st.reachable ? 1 : 0.4
                }).addTo(map);

                marker.on('click', () => {
                    selectStation(index);
                });
            });

            if(!hasReachable) {
                html = `<div class="text-center p-6 bg-red-50 rounded-xl border border-red-100 mb-4">
                            <i class="fa-solid fa-battery-empty text-3xl text-red-500 mb-2"></i>
                            <h3 class="font-bold text-red-800">Critical Low Battery</h3>
                            <p class="text-sm text-red-600 mt-1">No stations within ${(safeRange * DIST_FACTOR).toFixed(1)} ${DIST_LABEL}.</p>
                        </div>` + html;
            }

            container.innerHTML = html;
        }

        async function selectStation(index) {
            if (!processedStationsList || !processedStationsList[index]) return;
            const station = processedStationsList[index];
            
            // Allow viewing details but warn if too far
            if(!station.reachable) { 
                alert("⚠️ Warning: This station is beyond your estimated range.");
                // We let them proceed but with a warning, or return; to block
                // return; 
            }
            
            selectedStation = station;
            
            const container = document.getElementById('content-area');
            container.innerHTML = `
                <div class="flex flex-col h-full">
                    <div class="bg-white/60 backdrop-blur-md p-4 rounded-2xl border border-gray-200 mb-4 shadow-sm">
                        <div class="flex justify-between items-start gap-4">
                            <div class="min-w-0">
                                <h2 class="text-[18px] font-bold text-gray-900 leading-tight line-clamp-2">${station.name}</h2>
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-yellow-50 border border-yellow-100 text-[11px] font-bold text-yellow-700"><i class="fa-solid fa-star text-[9px]"></i> ${station.rating}</span>
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-50 border border-emerald-100 text-[11px] font-bold text-emerald-700">Recommended</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0">
                                <div class="text-2xl font-bold text-gray-900 tracking-tight leading-none">${(station.distance * DIST_FACTOR).toFixed(1)}</div>
                                <div class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide mt-0.5">${DIST_LABEL}</div>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="startRealNavigation()" class="w-full py-3.5 bg-gray-900 hover:bg-black text-white rounded-xl font-bold text-sm shadow-lg mb-auto flex items-center justify-center gap-2 transition transform active:scale-[0.98]">
                        <i class="fa-solid fa-play"></i> Start Simulation
                    </button>
                    
                    <button onclick="renderStationList(cachedStations)" class="mt-3 py-2 text-xs font-semibold text-gray-500 hover:text-gray-800 w-full text-center transition">Back to List</button>
                </div>`;
            
            if(routePolyline) map.removeLayer(routePolyline);
            const coords = [[userLat, userLng], [station.location.latitude, station.location.longitude]];
            routePolyline = L.polyline(coords, {color: '#3b82f6', weight: 6}).addTo(map);
            map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
        }

        function startRealNavigation() {
            if(!selectedStation) return;
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col h-full justify-center items-center pt-2">
                    <div class="text-center mb-4">
                        <h2 class="text-[20px] font-bold text-gray-900 tracking-tight leading-tight">Simulating Drive...</h2>
                        <p class="text-[13px] font-medium text-gray-500 mt-1">Driving to <span class="text-gray-800">${selectedStation.name}</span></p>
                    </div>
                    <button onclick="arriveAtStation()" class="w-full py-3.5 bg-gray-900 hover:bg-black text-white rounded-[18px] font-bold text-sm shadow-lg transition transform active:scale-[0.98]">Arrive Instantly</button>
                </div>`;
            document.getElementById('nav-status').style.display = 'block';
            
            if(carMarker) map.removeLayer(carMarker);
            carMarker = L.marker([userLat, userLng], {icon: carIcon}).addTo(map);
            let steps = 500; let step = 0;
            const dLat = (selectedStation.location.latitude - userLat) / steps;
            const dLng = (selectedStation.location.longitude - userLng) / steps;
            
            function move() {
                if(step >= steps) { arriveAtStation(); return; }
                const lat = userLat + (dLat * step);
                const lng = userLng + (dLng * step);
                carMarker.setLatLng([lat, lng]);
                map.panTo([lat, lng]);
                step++;
                animationFrameId = requestAnimationFrame(move);
            }
            move();
        }

        function arriveAtStation() {
            cancelAnimationFrame(animationFrameId);
            
            if (selectedStation && carMarker) {
                const destLat = selectedStation.location.latitude;
                const destLng = selectedStation.location.longitude;
                carMarker.setLatLng([destLat, destLng]);
                map.panTo([destLat, destLng]);
            }

            // Save the emergency trip to history
            saveEmergencyTrip();

            document.getElementById('nav-status').style.display = 'none';
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col h-full pt-2">
                    <div class="text-center mb-6">
                        <h2 class="text-[20px] font-bold text-gray-900 tracking-tight leading-tight">Charging Station</h2>
                        <p class="text-[13px] font-medium text-gray-500 mt-1">Input your new battery level.</p>
                    </div>
                    <div class="flex flex-col justify-center items-center bg-white/40 backdrop-blur-md border border-white/50 rounded-[24px] mb-6 shadow-sm py-6 h-[140px]">
                        <i class="fa-solid fa-bolt text-yellow-400 text-3xl mb-2 drop-shadow-sm"></i>
                        <div class="flex items-baseline">
                            <input type="number" id="new-batt-input" oninput="if(this.value>100)this.value=100; if(this.value<0)this.value=0;" class="text-4xl font-black text-gray-900 tracking-tighter text-center w-20 bg-transparent focus:outline-none placeholder:text-gray-200" placeholder="0" min="0" max="100">
                            <span class="text-xl font-bold text-gray-400 ml-1">%</span>
                        </div>
                    </div>
                    <div id="error-msg" class="text-center text-xs font-bold text-red-500 mb-4 hidden bg-red-50 py-2 rounded-lg border border-red-100">Charge to at least 70%.</div>
                    <button onclick="finishCharging()" class="w-full py-3.5 bg-gray-900 hover:bg-black text-white rounded-[18px] font-bold text-sm shadow-lg transition transform active:scale-[0.98]">Finish Charging</button>
                </div>`;
        }

        async function saveEmergencyTrip() {
            if (!selectedStation) return;
            const userId = localStorage.getItem("user_id");
            if (!userId) return;

            const dist = selectedStation.distance;
            // Calculate estimated drained % based on car specs
            const efficiency = CAR_SPECS.efficiency || 160; // Wh/km
            const capacity = CAR_SPECS.capacity || 60; // kWh
            const drainedKwh = dist * (efficiency / 1000);
            const drainedPct = (drainedKwh / capacity) * 100;

            try {
                await fetch('http://localhost/WEBPROG_PROJ/BACKEND/API/BATTERY/logs.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        distance_km: dist.toFixed(2),
                        battery_drained: drainedPct.toFixed(1),
                        origin: "Emergency Location",
                        destination: selectedStation.name
                    })
                });
            } catch (e) { console.error("Error saving emergency log", e); }
        }

        function finishCharging() {
            const val = parseInt(document.getElementById('new-batt-input').value);
            const err = document.getElementById('error-msg');
            if (!val || val < 70 || val > 100) { err.innerText = "Please charge to at least 70%."; err.classList.remove('hidden'); return; }
            
            // Save new battery level for Dashboard/Trip Planner
            localStorage.setItem('user_battery_level', val);

            document.getElementById('modal-final-batt').innerText = val + "%";
            document.getElementById('finish-modal').classList.add('active');
            localStorage.setItem("forceCharging", "0");
            localStorage.setItem("ev_lock_status", "unlocked");
            localStorage.removeItem("ev_target_charger");
        }

        function switchToHomeCharging() {
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col h-full pt-2">
                    <div class="text-center mb-6">
                        <h2 class="text-[20px] font-bold text-gray-900 tracking-tight leading-tight">Home Charging</h2>
                        <p class="text-[13px] font-medium text-gray-500 mt-1">Connect to your home charger.</p>
                    </div>
                    <div class="flex flex-col justify-center items-center bg-white/40 backdrop-blur-md border border-white/50 rounded-[24px] mb-6 shadow-sm py-6 h-[140px]">
                        <i class="fa-solid fa-plug text-emerald-500 text-3xl mb-2 drop-shadow-sm animate-bounce"></i>
                        <div class="flex items-baseline">
                            <input type="number" id="new-batt-input" oninput="if(this.value>100)this.value=100; if(this.value<0)this.value=0;" class="text-4xl font-black text-gray-900 tracking-tighter text-center w-20 bg-transparent focus:outline-none placeholder:text-gray-200" placeholder="0" min="0" max="100">
                            <span class="text-xl font-bold text-gray-400 ml-1">%</span>
                        </div>
                    </div>
                    <div id="error-msg" class="text-center text-xs font-bold text-red-500 mb-4 hidden bg-red-50 py-2 rounded-lg border border-red-100">Charge to at least 70%.</div>
                    <button onclick="finishCharging()" class="w-full py-3.5 bg-gray-900 hover:bg-black text-white rounded-[18px] font-bold text-sm shadow-lg transition transform active:scale-[0.98]">Finish Charging</button>
                    <button onclick="openCancelModal()" class="mt-3 py-3 w-full rounded-[18px] border border-gray-200 text-gray-500 font-bold text-xs hover:bg-gray-50 transition">Cancel</button>
                </div>`;
        }

        function exitToPlanner() { window.location.href = "trip_planner.html"; }
        
        function openCancelModal() {
            localStorage.removeItem('ev_charging_mode');
            window.location.reload();
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
