<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnerGo Intro</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/preview.css" />
</head>

<body>
  <div id="intro-screen" onclick="startApp()">

    <div class="brand-section">
      <h1 class="brand-name">ENERGO</h1>
    </div>

    <div class="model-stage">
      <div class="car-placeholder"></div>
    </div>

    <div class="info-section">
      <p class="description">
        Power your journey with smart energy.<br>
        Seamless. Sustainable. Future-ready.
      </p>
    </div>

    <!-- ✅ Always visible on compressed screens -->
    <div class="touch-hint">Touch anywhere to continue</div>

  </div>

  <script>
    function startApp() {
      document.getElementById('intro-screen').classList.add('fade-out-up');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 200);
    }
  </script>
</body>
</html>
