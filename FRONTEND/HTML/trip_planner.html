<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Trip Planner</title>
    <link rel="stylesheet" href="../UI_CSS/trip_planner.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="reactive-wrapper">
        <header class="app-header">
            <div class="header-content">
                <i data-lucide="x" class="icon-gray"></i>
                <div class="header-titles">
                    <h1>Plan New Trip</h1>
                    <p>Tesla Model 3 • Long Range</p>
                </div>
                <div class="status-dots"><span></span><span></span><span></span></div>
            </div>
        </header>

        <div id="loading-overlay" class="overlay hidden">
            <div class="loader-card">
                <div class="spinner"></div>
                <p>Calculating Optimal Routes...</p>
            </div>
        </div>

        <main class="container">
            <div id="plan-section">
                <div class="input-grid">
                    <section class="card">
                        <div class="card-header">
                            <div class="step-num yellow">1</div>
                            <h2>Current Battery Level</h2>
                        </div>
                        <div class="battery-input-box">
                            <div class="manual-input-container">
                                <input type="number" id="battery-input" value="75" min="0" max="100">
                                <span class="input-label">% Manual Input (Optional)</span>
                            </div>
                            <div class="battery-stats">
                                <p>Available Energy: <strong id="energy-val">56.3 kWh</strong></p>
                                <p>Estimated Range: <strong id="range-val" class="green-text">375 km</strong></p>
                            </div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="card-header">
                            <div class="step-num blue">2</div>
                            <h2>Trip Details</h2>
                        </div>
                        <div class="trip-fields">
                            <div class="field-group">
                                <label>From</label>
                                <div class="icon-input">
                                    <i data-lucide="map-pin" class="green-icon"></i>
                                    <input type="text" id="from-loc" value="SM Mall of Asia, Pasay">
                                </div>
                            </div>
                            <div class="connector-arrow"><i data-lucide="arrow-down"></i></div>
                            <div class="field-group">
                                <label>To</label>
                                <div class="icon-input">
                                    <i data-lucide="map-pin" class="blue-icon"></i>
                                    <input type="text" id="to-loc" value="Makati CBD">
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
                <button id="proceed-btn" class="btn-primary green-grad">Proceed to Routes</button>
            </div>

            <div id="results-section" class="hidden">
                <div class="dashboard-grid">
                    <div class="map-view">
                        <div class="map-placeholder">Route Preview Map</div>
                    </div>
                    <div class="routes-list-area">
                        <h3>Suggested Routes</h3>
                        <div class="route-item" data-route="EDSA">
                            <div class="route-main">
                                <strong>EDSA (Optimal)</strong>
                                <span>12m • 5.1km</span>
                            </div>
                            <div class="route-popup">
                                Energy: 0.9 kWh | Arrival: 74%
                            </div>
                        </div>
                        <button class="btn-primary blue-grad"><i data-lucide="navigation"></i> Start Navigation</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../UI_JS/trip_planner.js"></script>
</body>
</html>
