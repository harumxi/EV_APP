<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Planner</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Leaflet (Map) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- Polyline Decoder (Required for backend routes) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-polyline/1.1.1/polyline.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/trip_planner.css" />
</head>

<body class="overflow-x-hidden">
  <header class="app-header" style="border-bottom: none; box-shadow: none;">
    <div class="header-inner">
      <a href="dashboard.html" class="header-icon" aria-hidden="true">
        <i data-lucide="arrow-left"></i>
      </a>

      <div class="title-group">
        <h1 id="app-title">Trip Planner</h1>
        <p id="app-subtitle">Plan your next drive</p>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div id="map" aria-label="Map"></div>

    <aside id="panel" class="side-panel">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>

      <div class="panel-top">
        <h3 id="panel-title">Trip Controls</h3>
        <div id="weather-widget" style="display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4b5563; background-color: #f3f4f6; padding: 4px 10px; border-radius: 99px; border: 1px solid #e5e7eb;"></div>
      </div>

      <div class="panel-scroll" id="panel-scroll">
        <!-- Battery -->
        <section class="battery-input-box" id="battery-box">
          <div class="battery-ring-wrap">
            <div class="battery-ring" aria-label="Battery level">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-progress" cx="60" cy="60" r="52"></circle>
              </svg>

              <div class="ring-center">
                <i data-lucide="zap" class="ring-icon"></i>
                <div class="ring-value">
                  <span id="bat-display" class="bat-display">75</span>
                  <span class="ring-percent">%</span>
                </div>
              </div>
            </div>
          </div>

          <div class="battery-input-row">
            <input id="bat-input" type="number" min="0" max="100" inputmode="numeric" aria-label="Battery percentage" />
          </div>

          <div id="bat-error" class="battery-error">Battery must be between 0 and 100.</div>

          <div id="active-car-info" style="text-align: center; margin-bottom: 16px; margin-top: 24px; display: none; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; background-color: #f9fafb;">
            <div style="font-size: 10px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">Active Vehicle</div>
            <div id="car-name-display" style="font-size: 14px; font-weight: 700; color: #1f2937; margin-top: 2px;">--</div>
          </div>

          <div class="battery-stats">
            <div class="stat-item"><span>Available Energy</span><strong id="energy-txt">—</strong></div>
            <div class="stat-item"><span>Estimated Range</span><strong id="range-txt">—</strong></div>
          </div>
        </section>

        <!-- Trip inputs -->
        <section>
          <label>FROM</label>
          <div class="suggest-wrap">
            <div class="input-icon-box" id="from-box">
              <i data-lucide="map-pin"></i>
              <input id="from-input" placeholder="Search starting location…" value="" autocomplete="off" />
            </div>
            <div id="from-suggest" class="suggest-list"></div>
          </div>

          <div class="connector"><i data-lucide="arrow-down"></i></div>

          <label>TO</label>
          <div class="suggest-wrap">
            <div class="input-icon-box" id="to-box">
              <i data-lucide="map-pin"></i>
              <input id="to-input" placeholder="Search destination…" value="" autocomplete="off" />
            </div>
            <div id="to-suggest" class="suggest-list"></div>
          </div>

          <p class="tip">Tip: type “SM” to see options, or click the field.</p>
        </section>

        <!-- Loading AFTER Start -->
        <div id="after-start-loading" class="panel-loading" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text">Preparing navigation…</div>
        </div>

        <!-- Results -->
        <section id="results-section" class="results-section hidden">
          <div class="routes-list" id="routes-list" aria-label="Suggested list"></div>

          <div class="route-details" id="route-details">
            <div class="rd-title" id="rd-title">Select an item</div>
            <div class="rd-note" id="rd-note">Details will appear here.</div>
            <div class="rd-grid">
              <div class="rd-metric"><span id="rd-m1-label">Energy</span><b id="rd-energy">—</b></div>
              <div class="rd-metric"><span id="rd-m2-label">Arrival</span><b id="rd-arrival">—</b></div>
              <div class="rd-metric"><span id="rd-m3-label">ETA</span><b id="rd-eta">—</b></div>
            </div>
          </div>
        </section>
      </div>

      <div class="panel-footer">
        <div class="routes-actions">
          <button id="recalc-btn" class="btn-main btn-secondary" style="display:none;">
            <span class="btn-row"><i data-lucide="refresh-ccw"></i> Recalculate</span>
          </button>
          <button id="start-nav" class="btn-main" disabled>
            <span class="btn-row"><i data-lucide="navigation"></i> Start Navigation</span>
          </button>
        </div>
      </div>
    </aside>
  </div>

<nav class="fixed bottom-0 left-0 w-screen bg-white/50 backdrop-blur-xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-[5000]">
  <div class="mx-auto max-w-6xl px-4 py-1">
    <div id="bottomNav" class="grid grid-cols-4 gap-2 text-center">

      <button class="nav-item flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="dashboard" onclick="window.location.href='dashboard.html'">
        <svg class="h-5 w-5 text-black/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="2"></rect>
          <rect x="14" y="3" width="7" height="7" rx="2"></rect>
          <rect x="3" y="14" width="7" height="7" rx="2"></rect>
          <rect x="14" y="14" width="7" height="7" rx="2"></rect>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black/60">Dashboard</span>
      </button>

      <button class="nav-item relative flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="trip-planner" onclick="window.location.href='trip_planner.html'">
        <div class="absolute top-0 h-1 w-8 bg-black rounded-b-full"></div>
        <svg class="h-5 w-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2"></circle>
          <circle cx="18" cy="18" r="2"></circle>
          <path d="M8 6h6a2 2 0 0 1 2 2v2"></path>
          <path d="M16 14v2a2 2 0 0 1-2 2H8"></path>
          <path d="M8 18l-2 2"></path>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black">Trip Planner</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="charging" onclick="window.location.href='hubs.html'">
        <svg class="h-5 w-5 text-black/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black/60">Charging Hub</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="profile" onclick="window.location.href='profile.html'">
        <svg class="h-5 w-5 text-black/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black/60">Profile</span>
      </button>

    </div>
  </div>
</nav>

  <script src="../JS/trip_planner.js"></script>
</body>
</html>
