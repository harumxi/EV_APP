<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Planner</title>

  <!-- Fonts + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Leaflet (Map) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- Polyline Decoder (Required for backend routes) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-polyline/1.1.1/polyline.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/trip_planner.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="dashboard.html" class="header-icon" aria-hidden="true">
        <i data-lucide="arrow-left"></i>
      </a>

      <div class="title-group">
        <h1 id="app-title">Trip Planner</h1>
        <p id="app-subtitle">Plan your next drive</p>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div id="map" aria-label="Map"></div>

    <aside id="panel" class="side-panel">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>

      <div class="panel-top">
        <h3 id="panel-title">Trip Controls</h3>
        <div class="mode-pill" id="mode-pill">Ready</div>
      </div>

      <div class="panel-scroll" id="panel-scroll">
        <!-- Battery -->
        <section class="battery-input-box" id="battery-box">
          <div class="battery-ring-wrap">
            <div class="battery-ring" aria-label="Battery level">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-progress" cx="60" cy="60" r="52"></circle>
              </svg>

              <div class="ring-center">
                <i data-lucide="zap" class="ring-icon"></i>
                <div class="ring-value">
                  <span id="bat-display" class="bat-display">75</span>
                  <span class="ring-percent">%</span>
                </div>
              </div>
            </div>
          </div>

          <div class="battery-input-row">
            <input id="bat-input" type="number" min="0" max="100" inputmode="numeric" aria-label="Battery percentage" />
          </div>

          <div id="bat-error" class="battery-error">Battery must be between 0 and 100.</div>

          <div class="battery-stats">
            <div class="stat-item"><span>Available Energy</span><strong id="energy-txt">—</strong></div>
            <div class="stat-item"><span>Estimated Range</span><strong id="range-txt">—</strong></div>
          </div>
        </section>

        <!-- Trip inputs -->
        <section>
          <label>FROM</label>
          <div class="suggest-wrap">
            <div class="input-icon-box" id="from-box">
              <i data-lucide="map-pin"></i>
              <input id="from-input" placeholder="Search starting location…" value="" autocomplete="off" />
            </div>
            <div id="from-suggest" class="suggest-list"></div>
          </div>

          <div class="connector"><i data-lucide="arrow-down"></i></div>

          <label>TO</label>
          <div class="suggest-wrap">
            <div class="input-icon-box" id="to-box">
              <i data-lucide="map-pin"></i>
              <input id="to-input" placeholder="Search destination…" value="" autocomplete="off" />
            </div>
            <div id="to-suggest" class="suggest-list"></div>
          </div>

          <p class="tip">Tip: type “SM” to see options, or click the field.</p>
        </section>

        <!-- Loading AFTER Start -->
        <div id="after-start-loading" class="panel-loading" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text">Preparing navigation…</div>
        </div>

        <!-- Results -->
        <section id="results-section" class="results-section hidden">
          <div class="routes-list" id="routes-list" aria-label="Suggested list"></div>

          <div class="route-details" id="route-details">
            <div class="rd-title" id="rd-title">Select an item</div>
            <div class="rd-note" id="rd-note">Details will appear here.</div>
            <div class="rd-grid">
              <div class="rd-metric"><span id="rd-m1-label">Energy</span><b id="rd-energy">—</b></div>
              <div class="rd-metric"><span id="rd-m2-label">Arrival</span><b id="rd-arrival">—</b></div>
              <div class="rd-metric"><span id="rd-m3-label">ETA</span><b id="rd-eta">—</b></div>
            </div>
          </div>
        </section>
      </div>

      <div class="panel-footer">
        <div class="routes-actions">
          <button id="recalc-btn" class="btn-main btn-secondary" style="display:none;">
            <span class="btn-row"><i data-lucide="refresh-ccw"></i> Recalculate</span>
          </button>
          <button id="start-nav" class="btn-main" disabled>
            <span class="btn-row"><i data-lucide="navigation"></i> Start Navigation</span>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <script src="../JS/trip_planner.js"></script>
</body>
</html>
