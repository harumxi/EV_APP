<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Trip Planner</title>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../UI_CSS/trip_planner.css" />
</head>

<body>
  <div class="reactive-wrapper">
    <header class="app-header">
      <div class="header-content">
        <div class="title-group">
          <h1>Plan New Trip</h1>
          <p>Tesla Model 3 • Long Range</p>
        </div>
        <div class="nav-dots"><span></span><span></span><span></span></div>
      </div>
    </header>

    <div id="loading-overlay" class="overlay hidden">
      <div class="spinner"></div>
    </div>

    <main>
      <div id="input-view">
        <div class="form-grid">
          <section id="battery-card" class="ui-card">
            <div class="card-head">
              <div class="step-badge">1</div>
              <h2 class="card-title">Current Battery Level</h2>
            </div>

            <div class="battery-input-box">
              <div class="battery-ring-wrap">
                <div class="battery-ring" aria-label="Battery level">
                  <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                    <circle class="ring-progress" cx="60" cy="60" r="52"></circle>
                  </svg>

                  <div class="ring-center">
                    <i data-lucide="zap" class="ring-icon"></i>
                    <div class="ring-value">
                      <span id="bat-display" class="bat-display">75</span>
                      <span class="ring-percent">%</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="battery-input-row">
                <input id="bat-input" type="number" min="0" max="100" inputmode="numeric" aria-label="Battery percentage" />
              </div>

              <div class="battery-stats">
                <div class="stat-item"><span>Available Energy</span><strong id="energy-txt">—</strong></div>
                <div class="stat-item"><span>Estimated Range</span><strong id="range-txt">—</strong></div>
              </div>
            </div>
          </section>

          <section id="trip-card" class="ui-card">
            <div class="card-head">
              <div class="step-badge">2</div>
              <h2 class="card-title">Trip Details</h2>
            </div>

            <label>FROM</label>
            <div class="suggest-wrap">
              <div class="input-icon-box">
                <i data-lucide="map-pin"></i>
                <input id="from-input" placeholder="Search starting location…" value="SM Mall of Asia, Pasay" autocomplete="off" />
              </div>
              <div id="from-suggest" class="suggest-list"></div>
            </div>

            <div class="connector"><i data-lucide="arrow-down"></i></div>

            <label>TO</label>
            <div class="suggest-wrap">
              <div class="input-icon-box">
                <i data-lucide="map-pin"></i>
                <input id="to-input" placeholder="Search destination…" value="Makati CBD" autocomplete="off" />
              </div>
              <div id="to-suggest" class="suggest-list"></div>
            </div>

            <p class="tip">Tip: click the input to pick from suggestions.</p>
          </section>
        </div>

        <button id="proceed-btn" class="btn-main btn-wide">
          <span class="btn-row"><i data-lucide="zap"></i> Calculate Battery Forecast</span>
        </button>
      </div>

      <div id="results-view" class="hidden">
        <div class="dashboard-grid">
          <div class="map-area">
            <div class="map-placeholder" id="map-ph">Map Preview</div>
          </div>

          <div class="routes-area">
            <div id="routes-panel" class="routes-panel">
              <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>
              <h3>Suggested Routes</h3>

              <div class="routes-list" id="routes-list"></div>

              <div class="route-details" id="route-details">
                <div class="rd-title" id="rd-title">Select a route</div>
                <div class="rd-note" id="rd-note">Route details will appear here.</div>
                <div class="rd-grid">
                  <div class="rd-metric"><span>Energy</span><b id="rd-energy">—</b></div>
                  <div class="rd-metric"><span>Arrival</span><b id="rd-arrival">—</b></div>
                  <div class="rd-metric"><span>ETA</span><b id="rd-eta">—</b></div>
                </div>
              </div>

              <div class="routes-actions">
                <button id="recalc-btn" class="btn-main btn-secondary">
                  <span class="btn-row"><i data-lucide="refresh-ccw"></i> Recalculate</span>
                </button>
                <button id="start-nav" class="btn-main" disabled>Start Navigation</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../UI_JS/trip_planner.js"></script>
</body>
</html>
