<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charging Hubs Directory</title>

  <!-- Tailwind + Dark-mode bootstrap -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.getItem('pref_dark') === 'true') {
      document.documentElement.classList.add('dark');
    }
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Fonts + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="../CSS/trip_planner.css" />

  <style>
    /* Hide scrollbar for clean panel */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Hubs specific overrides to match Trip Planner theme */
    .filter-chip {
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: #f3f4f6;
        color: #4b5563;
        border: 1px solid transparent;
        transition: all 0.2s;
    }
    .filter-chip.active {
        background: #111827;
        color: white;
    }
    .filter-chip:hover:not(.active) {
        background: #e5e7eb;
    }
    
    /* Card Styles (Ported from hubs.css) */
    .hub-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        gap: 12px;
        position: relative;
    }
    .hub-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        border-color: #3b82f6;
    }
    .hub-card.active { border: 2px solid #3b82f6; background: #eff6ff; }

    .hub-icon {
        width: 48px;
        height: 48px;
        background: #f3f4f6;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #374151;
        flex-shrink: 0;
    }

    /* Toast (Ported from hubs.css) */
    #toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        z-index: 2000; background: #1e293b; color: white; padding: 12px 24px;
        border-radius: 99px; font-weight: 700; font-size: 13px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0;
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        display: flex; align-items: center; gap: 8px;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .search-section { padding-bottom: 10px; }
    .sidebar { display: none; } /* Hide legacy sidebar if CSS leaks */

    /* Modal Styles from Trip Planner */
    .modal-bg {
        background: rgba(0,0,0,0.6) !important; backdrop-filter: blur(4px) !important;
    }
    
    .success-card {
        background: white !important;
        width: 90% !important;
        max-width: 400px !important;
        border-radius: 24px !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
        overflow: hidden !important;
        display: flex !important;
        flex-direction: column !important;
        max-height: 80vh !important;
    }

    /* Force Start Navigation button to be black */
    #detail-content button {
        background-color: #111827 !important;
        color: white !important;
    }
  </style>
</head>

<body class="overflow-x-hidden">
  <header class="fixed top-0 left-0 right-0 z-[5000] bg-white/50 backdrop-blur-[20px] border-b border-white/40 shadow-xl">
    <div class="mx-auto max-w-6xl h-[68px] px-4 flex items-center justify-between">
      <div class="text-2xl font-bold text-gray-900 tracking-tight">Charging Hubs</div>
      
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <div class="text-sm font-semibold text-gray-900 leading-tight" id="header-user-name">User</div>
          <div class="text-xs font-medium text-gray-500 mt-0.5" id="header-car-name">No Car Selected</div>
        </div>
        <img src="https://i.pravatar.cc/256?img=12" alt="Profile" class="h-10 w-10 rounded-full border border-white/60 shadow-sm object-cover" />
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div id="map" aria-label="Map"></div>

    <aside id="panel" class="side-panel !bg-white/50 !backdrop-blur-[20px] !border !border-white/40 !shadow-xl !rounded-[28px] overflow-hidden flex flex-col transition-transform duration-300 !p-0">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>

      <div class="panel-top flex items-center justify-between gap-3 px-4 pt-4 pb-2 md:px-5 md:pt-5 md:pb-3 border-b border-black/5 shrink-0">
        <h3 id="panel-title" class="text-lg font-bold text-gray-900 tracking-tight">Find Station</h3>
        <div class="mode-pill">Live</div>
      </div>

      <div class="panel-scroll no-scrollbar px-4 pb-20 space-y-3 md:px-5 md:pb-4 md:space-y-4" id="panel-scroll">
        <section class="search-section search-area">
            <div class="suggest-wrap">
                <div class="input-icon-box relative">
                  <i data-lucide="search"></i>
                  <input id="search-input" placeholder="Search city, mall, or area..." onkeypress="handleEnter(event)" autocomplete="off" />
                  <button onclick="performSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black">
                    <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
                <div id="search-suggest" class="suggest-list"></div>
            </div>
            
            <div class="flex gap-2 mt-3 flex-wrap">
                <div class="filter-chip active" onclick="toggleFilter(this, 'all')">All</div>
                <div class="filter-chip" onclick="toggleFilter(this, 'Favorites')">❤️ Favorites</div>
            </div>
        </section>

        <div id="results-list" class="results-list">
            <div class="text-center mt-10 text-gray-400 text-sm">
                <i class="fa-solid fa-map-location-dot text-4xl mb-2 opacity-50"></i>
                <p>Search a location to find chargers.</p>
            </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- REVIEWS MODAL -->
  <div id="reviews-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4 modal-bg">
    <div class="success-card">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white">
        <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="review-station-name">Station Reviews</h3>
        <button onclick="closeReviewsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <div class="p-5 bg-white flex items-center justify-between">
        <div>
          <div class="text-4xl font-black text-blue-600 tracking-tighter" id="review-avg">--</div>
          <div class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Average Rating</div>
        </div>
        <div class="text-right">
          <button onclick="toggleReviewForm()"
            class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-200 hover:bg-blue-700 transition transform active:scale-95">
            Write Review
          </button>
        </div>
      </div>

      <div id="review-form-box" class="hidden p-5 bg-white border-b border-gray-100 transition-all">
        <div class="flex gap-2 mb-4 justify-center" id="star-container">
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(1)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(2)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(3)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(4)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(5)"></i>
        </div>
        <input type="hidden" id="review-rating" value="0" />
        <textarea id="review-comment"
          class="w-full p-4 rounded-xl border border-gray-200 text-sm font-medium focus:border-blue-500 outline-none mb-3 resize-none"
          rows="3"
          placeholder="Share your experience..."></textarea>
        <button onclick="submitReview()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-sm hover:bg-black transition shadow-lg">
          Post Review
        </button>
      </div>

      <div id="reviews-list" class="flex-1 overflow-y-auto p-5 space-y-4 bg-white"></div>
    </div>
  </div>

  <!-- STATION DETAILS MODAL -->
  <div id="details-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4 modal-bg">
    <div class="success-card">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white">
        <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="detail-title">Station Details</h3>
        <button onclick="closeDetailsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <div id="detail-content" class="flex-1 overflow-y-auto p-6 space-y-6 text-sm text-gray-700"></div>
    </div>
  </div>

  <div id="toast"><i class="fa-solid fa-circle-info text-blue-400"></i> <span id="toast-msg">Notification</span></div>

<nav class="fixed bottom-0 left-0 w-screen bg-white/50 backdrop-blur-xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-[5000]">
  <div class="mx-auto max-w-6xl px-4 py-1">
    <div id="bottomNav" class="grid grid-cols-4 gap-2 text-center">

      <button class="nav-item flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="dashboard" onclick="window.location.href='dashboard.html'">
        <svg class="h-5 w-5 text-black/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="2"></rect>
          <rect x="14" y="3" width="7" height="7" rx="2"></rect>
          <rect x="3" y="14" width="7" height="7" rx="2"></rect>
          <rect x="14" y="14" width="7" height="7" rx="2"></rect>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black/60">Dashboard</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="trip-planner" onclick="window.location.href='trip_planner.html'">
        <svg class="h-5 w-5 text-black/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2"></circle>
          <circle cx="18" cy="18" r="2"></circle>
          <path d="M8 6h6a2 2 0 0 1 2 2v2"></path>
          <path d="M16 14v2a2 2 0 0 1-2 2H8"></path>
          <path d="M8 18l-2 2"></path>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black/60">Trip Planner</span>
      </button>

      <button class="nav-item relative flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="charging" onclick="window.location.href='hubs.html'">
        <div class="absolute top-0 h-1 w-8 bg-black rounded-b-full"></div>
        <svg class="h-5 w-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black">Charging Hub</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-0.5 py-1 rounded-xl hover:bg-black/5 transition-transform active:scale-95" type="button" data-tab="profile" onclick="window.location.href='profile.html'">
        <svg class="h-5 w-5 text-black/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-label text-[10px] font-semibold text-black/60">Profile</span>
      </button>

    </div>
  </div>
</nav>

  <!-- Vendor JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Your JS -->
  <script src="../JS/hubs.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Populate Header
    const headerUser = document.getElementById('header-user-name');
    const headerCar = document.getElementById('header-car-name');
    const activeCarObj = JSON.parse(localStorage.getItem('active_car') || "null");
    if(headerUser) headerUser.textContent = localStorage.getItem('full_display_name') || 'User';
    if(headerCar && activeCarObj) headerCar.textContent = `${activeCarObj.brand} ${activeCarObj.model}`;
    
    // Mobile sheet logic
    const panel = document.getElementById("panel");
    const sheetHandle = document.getElementById("sheet-handle");
    if(sheetHandle) {
        sheetHandle.addEventListener("click", () => {
            panel.classList.toggle("closed");
        });
    }
  </script>
</body>
</html>
