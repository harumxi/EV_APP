<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charging Hubs Directory</title>

  <!-- Tailwind + Dark-mode bootstrap -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.getItem('pref_dark') === 'true') {
      document.documentElement.classList.add('dark');
    }
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Fonts + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="../CSS/trip_planner.css" />

  <style>
    /* Hubs specific overrides to match Trip Planner theme */
    .filter-chip {
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: #f3f4f6;
        color: #4b5563;
        border: 1px solid transparent;
        transition: all 0.2s;
    }
    .filter-chip.active {
        background: #111827;
        color: white;
    }
    .filter-chip:hover:not(.active) {
        background: #e5e7eb;
    }
    
    /* Card Styles (Ported from hubs.css) */
    .hub-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        gap: 12px;
        position: relative;
    }
    .hub-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        border-color: #3b82f6;
    }
    .hub-card.active { border: 2px solid #3b82f6; background: #eff6ff; }

    .hub-icon {
        width: 48px;
        height: 48px;
        background: #f3f4f6;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #374151;
        flex-shrink: 0;
    }

    /* Toast (Ported from hubs.css) */
    #toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        z-index: 2000; background: #1e293b; color: white; padding: 12px 24px;
        border-radius: 99px; font-weight: 700; font-size: 13px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0;
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        display: flex; align-items: center; gap: 8px;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .search-section { padding-bottom: 10px; }
    .sidebar { display: none; } /* Hide legacy sidebar if CSS leaks */
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="dashboard.html" class="header-icon" aria-hidden="true">
        <i data-lucide="arrow-left"></i>
      </a>

      <div class="title-group">
        <h1 id="app-title">Charging Hubs</h1>
        <p id="app-subtitle">Directory & Reviews</p>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div id="map" aria-label="Map"></div>

    <aside id="panel" class="side-panel">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>

      <div class="panel-top">
        <h3 id="panel-title">Find Station</h3>
        <div class="mode-pill">Live</div>
      </div>

      <div class="panel-scroll" id="panel-scroll">
        <section class="search-section search-area">
            <div class="suggest-wrap">
                <div class="input-icon-box relative">
                  <i data-lucide="search"></i>
                  <input id="search-input" placeholder="Search city, mall, or area..." onkeypress="handleEnter(event)" autocomplete="off" />
                  <button onclick="performSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black">
                    <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
                <div id="search-suggest" class="suggest-list"></div>
            </div>
            
            <div class="flex gap-2 mt-3 flex-wrap">
                <div class="filter-chip active" onclick="toggleFilter(this, 'all')">All</div>
                <div class="filter-chip" onclick="toggleFilter(this, 'Favorites')">❤️ Favorites</div>
            </div>
        </section>

        <div id="results-list" class="results-list">
            <div class="text-center mt-10 text-gray-400 text-sm">
                <i class="fa-solid fa-map-location-dot text-4xl mb-2 opacity-50"></i>
                <p>Search a location to find chargers.</p>
            </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- REVIEWS MODAL -->
  <div id="reviews-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="review-station-name">Station Reviews</h3>
        <button onclick="closeReviewsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <div class="p-5 bg-blue-50 flex items-center justify-between">
        <div>
          <div class="text-4xl font-black text-blue-600 tracking-tighter" id="review-avg">--</div>
          <div class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Average Rating</div>
        </div>
        <div class="text-right">
          <button onclick="toggleReviewForm()"
            class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-200 hover:bg-blue-700 transition transform active:scale-95">
            Write Review
          </button>
        </div>
      </div>

      <div id="review-form-box" class="hidden p-5 bg-gray-50 border-b border-gray-100 transition-all">
        <div class="flex gap-2 mb-4 justify-center" id="star-container">
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(1)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(2)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(3)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(4)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(5)"></i>
        </div>
        <input type="hidden" id="review-rating" value="0" />
        <textarea id="review-comment"
          class="w-full p-4 rounded-xl border border-gray-200 text-sm font-medium focus:border-blue-500 outline-none mb-3 resize-none"
          rows="3"
          placeholder="Share your experience..."></textarea>
        <button onclick="submitReview()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-sm hover:bg-black transition shadow-lg">
          Post Review
        </button>
      </div>

      <div id="reviews-list" class="flex-1 overflow-y-auto p-5 space-y-4 bg-white"></div>
    </div>
  </div>

  <!-- STATION DETAILS MODAL -->
  <div id="details-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="detail-title">Station Details</h3>
        <button onclick="closeDetailsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <div id="detail-content" class="flex-1 overflow-y-auto p-6 space-y-6 text-sm text-gray-700"></div>
    </div>
  </div>

  <div id="toast"><i class="fa-solid fa-circle-info text-blue-400"></i> <span id="toast-msg">Notification</span></div>

  <!-- Vendor JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Your JS -->
  <script src="../JS/hubs.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
    
    // Mobile sheet logic
    const panel = document.getElementById("panel");
    const sheetHandle = document.getElementById("sheet-handle");
    if(sheetHandle) {
        sheetHandle.addEventListener("click", () => {
            panel.classList.toggle("closed");
        });
    }
  </script>
</body>
</html>
