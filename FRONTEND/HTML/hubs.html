<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charging Hubs Directory</title>

  <!-- Tailwind + Dark-mode bootstrap -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.getItem('pref_dark') === 'true') {
      document.documentElement.classList.add('dark');
    }
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="../CSS/hubs.css" />
</head>

<body>
  <div class="sidebar">
    <div class="search-area">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-black text-gray-900 flex items-center gap-2">
          <i class="fa-solid fa-charging-station text-blue-600"></i> Charging Hubs
        </h1>
        <a href="dashboard.html"
           class="w-10 h-10 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center transition shadow-sm"
           title="Back to Dashboard">
          <i class="fa-solid fa-house"></i>
        </a>
      </div>

      <div class="relative mb-4">
        <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input
          type="text"
          id="search-input"
          class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl font-bold text-gray-700 outline-none focus:border-blue-500 transition"
          placeholder="Search city, mall, or area..."
          onkeypress="handleEnter(event)"
        />
        <button
          onclick="performSearch()"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center hover:bg-blue-700"
        >
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <div class="flex gap-2 flex-wrap">
        <div class="filter-chip active" onclick="toggleFilter(this, 'all')">All</div>
        <div class="filter-chip" onclick="toggleFilter(this, 'Favorites')">❤️ Favorites</div>
      </div>
    </div>

    <div id="results-list" class="results-list">
      <div class="text-center mt-10 text-gray-400 text-sm">
        <i class="fa-solid fa-map-location-dot text-4xl mb-2 opacity-50"></i>
        <p>Search a location to find chargers.</p>
      </div>
    </div>
  </div>

  <!-- REVIEWS MODAL -->
  <div id="reviews-modal" class="hidden fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="review-station-name">Station Reviews</h3>
        <button onclick="closeReviewsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <div class="p-5 bg-blue-50 flex items-center justify-between">
        <div>
          <div class="text-4xl font-black text-blue-600 tracking-tighter" id="review-avg">--</div>
          <div class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Average Rating</div>
        </div>
        <div class="text-right">
          <button onclick="toggleReviewForm()"
            class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-200 hover:bg-blue-700 transition transform active:scale-95">
            Write Review
          </button>
        </div>
      </div>

      <div id="review-form-box" class="hidden p-5 bg-gray-50 border-b border-gray-100 transition-all">
        <div class="flex gap-2 mb-4 justify-center" id="star-container">
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(1)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(2)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(3)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(4)"></i>
          <i class="fa-solid fa-star text-3xl cursor-pointer text-gray-200 hover:text-yellow-400 transition" onclick="setRating(5)"></i>
        </div>
        <input type="hidden" id="review-rating" value="0" />
        <textarea id="review-comment"
          class="w-full p-4 rounded-xl border border-gray-200 text-sm font-medium focus:border-blue-500 outline-none mb-3 resize-none"
          rows="3"
          placeholder="Share your experience..."></textarea>
        <button onclick="submitReview()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-sm hover:bg-black transition shadow-lg">
          Post Review
        </button>
      </div>

      <div id="reviews-list" class="flex-1 overflow-y-auto p-5 space-y-4 bg-white"></div>
    </div>
  </div>

  <!-- STATION DETAILS MODAL -->
  <div id="details-modal" class="hidden fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="detail-title">Station Details</h3>
        <button onclick="closeDetailsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <div id="detail-content" class="flex-1 overflow-y-auto p-6 space-y-6 text-sm text-gray-700"></div>
    </div>
  </div>

  <div id="map"></div>
  <div id="toast"><i class="fa-solid fa-circle-info text-blue-400"></i> <span id="toast-msg">Notification</span></div>

  <!-- Vendor JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Your JS -->
  <script src="../JS/hubs.js"></script>
</body>
</html>
