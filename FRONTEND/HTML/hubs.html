<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charging Hubs Directory</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; background: #f3f4f6; }
        
        /* SIDEBAR (Directory Style) */
        .sidebar {
            width: 400px; background: white; z-index: 20;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
            padding: 0; border-right: 1px solid #e5e7eb;
        }

        .search-area {
            padding: 20px; background: white; border-bottom: 1px solid #f3f4f6;
            box-shadow: 0 4px 6px -4px rgba(0,0,0,0.05); z-index: 10;
        }

        .filter-chip {
            font-size: 12px; font-weight: 700; padding: 6px 12px;
            border-radius: 99px; border: 1px solid #e5e7eb;
            cursor: pointer; transition: 0.2s; color: #6b7280; background: #fff;
        }
        .filter-chip:hover { background: #f9fafb; border-color: #d1d5db; }
        .filter-chip.active { background: #111827; color: white; border-color: #111827; }

        .results-list { flex: 1; overflow-y: auto; padding: 10px; background: #f9fafb; }

        .hub-card {
            background: white; border: 1px solid #e5e7eb; border-radius: 16px;
            padding: 16px; margin-bottom: 12px; cursor: pointer; transition: 0.2s;
            display: flex; gap: 12px; position: relative;
        }
        .hub-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #3b82f6; }
        .hub-card.active { border: 2px solid #3b82f6; background: #eff6ff; }

        .hub-icon {
            width: 48px; height: 48px; background: #f3f4f6; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #374151; flex-shrink: 0;
        }

        /* NAVIGATION BUTTON */
        .nav-btn {
            background: #2563eb; color: white; border: none; padding: 8px 12px;
            border-radius: 10px; font-weight: 700; font-size: 11px;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
            text-transform: uppercase;
        }
        .nav-btn:hover { background: #1d4ed8; transform: scale(1.05); }

        /* MAP */
        #map { flex: 1; height: 100%; z-index: 10; }
        .leaflet-control-layers { border-radius: 12px !important; border: none !important; box-shadow: 0 4px 10px rgba(0,0,0,0.15) !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="search-area">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-xl font-black text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-charging-station text-blue-600"></i> Charging Hubs
                </h1>
                <a href="dashboard.html" class="w-10 h-10 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center transition shadow-sm" title="Back to Dashboard">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
            
            <div class="relative mb-4">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl font-bold text-gray-700 outline-none focus:border-blue-500 transition" 
                       placeholder="Search city, mall, or area..." onkeypress="handleEnter(event)">
                <button onclick="performSearch()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center hover:bg-blue-700">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div class="flex gap-2 flex-wrap">
                <div class="filter-chip active" onclick="toggleFilter(this, 'all')">All</div>
                <div class="filter-chip" onclick="toggleFilter(this, 'DC Fast')">⚡ DC Fast</div>
                <div class="filter-chip" onclick="toggleFilter(this, 'Type 2')">Type 2</div>
                <div class="filter-chip" onclick="toggleFilter(this, 'Free')">Free Charge</div>
            </div>
        </div>

        <div id="results-list" class="results-list">
            <div class="text-center mt-10 text-gray-400 text-sm">
                <i class="fa-solid fa-map-location-dot text-4xl mb-2 opacity-50"></i>
                <p>Search a location to find chargers.</p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/API/CHARGING/nearby.php";
        let map;
        let markers = [];
        let currentStations = [];

        const thunderIcon = L.divIcon({
            html: '<div style="background: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border: 2px solid #eab308;"><i class="fa-solid fa-bolt text-yellow-500 text-xl"></i></div>',
            className: '',
            iconSize: [36, 36],
            iconAnchor: [18, 36],
            popupAnchor: [0, -36]
        });

        document.addEventListener("DOMContentLoaded", () => {
            initMap();
        });

        function initMap() {
            const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: 'OpenStreetMap' });
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri Satellite' });

            map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([14.5995, 120.9842], 12);
            const baseMaps = { "Street Map": streetLayer, "Satellite": satelliteLayer };
            L.control.layers(baseMaps).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const { latitude, longitude } = pos.coords;
                    map.setView([latitude, longitude], 14);
                    fetchChargers(latitude, longitude);
                });
            }
        }

        function handleEnter(e) { if(e.key === 'Enter') performSearch(); }

        async function performSearch() {
            const query = document.getElementById('search-input').value;
            if(!query) return;
            document.getElementById('results-list').innerHTML = `<div class="p-4 text-center text-gray-500"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching location...</div>`;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=ph`);
                const data = await res.json();
                if(data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.flyTo([lat, lon], 14);
                    fetchChargers(lat, lon);
                } else {
                    alert("Location not found.");
                    document.getElementById('results-list').innerHTML = "";
                }
            } catch(e) { alert("Search failed."); }
        }

        async function fetchChargers(lat, lon) {
            document.getElementById('results-list').innerHTML = `<div class="p-4 text-center text-gray-500"><i class="fa-solid fa-bolt fa-bounce"></i> Finding hubs...</div>`;
            try {
                const res = await fetch(`${API_URL}?lat=${lat}&lon=${lon}`);
                const stations = await res.json();
                currentStations = stations; 
                renderList(stations);
                plotMap(stations);
            } catch(e) { console.error(e); }
        }

        // --- NEW NAVIGATION TRIGGER ---
        function triggerNavigation(name, lat, lng) {
            const destination = { name, lat, lng };
            localStorage.setItem('nav_destination', JSON.stringify(destination));
            alert(`Ready to navigate to ${name}. Opening Trip Planner...`);
            window.location.href = 'trip_planner.html';
        }

        function renderList(stations) {
            const container = document.getElementById('results-list');
            container.innerHTML = "";
            if(stations.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400">No chargers found.</div>`;
                return;
            }
            stations.forEach((st, index) => {
                const isFast = Math.random() > 0.5;
                const plugs = isFast ? "CCS2 • Type 2" : "Type 2 Only";
                const price = isFast ? "₱35/kWh" : "Free";
                const iconColor = isFast ? "text-yellow-500" : "text-blue-500";

                const div = document.createElement('div');
                div.className = "hub-card";
                div.innerHTML = `
                    <div class="hub-icon"><i class="fa-solid fa-charging-station ${iconColor}"></i></div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-900 text-sm">${st.name}</h3>
                            <span class="text-xs font-bold bg-gray-100 px-2 py-1 rounded text-gray-600">${price}</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1">${st.address.town || st.address.city || 'Nearby'}</div>
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-[10px] font-bold border border-gray-200 px-2 py-0.5 rounded text-gray-500">${plugs}</span>
                            <button onclick="event.stopPropagation(); triggerNavigation('${st.name}', ${st.location.latitude}, ${st.location.longitude})" class="nav-btn">
                                <i class="fa-solid fa-location-arrow"></i> Navigate
                            </button>
                        </div>
                    </div>
                `;
                div.onclick = () => focusStation(st, div);
                container.appendChild(div);
            });
        }

        function plotMap(stations) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            stations.forEach(st => {
                const marker = L.marker([st.location.latitude, st.location.longitude], { icon: thunderIcon }).addTo(map);
                
                // Create detailed popup with Nav button
                const popupContent = `
                    <div class="text-center p-1">
                        <b class="text-sm">${st.name}</b><br>
                        <span class="text-xs text-gray-500">${st.address.town || ''}</span><br>
                        <button onclick="triggerNavigation('${st.name}', ${st.location.latitude}, ${st.location.longitude})" 
                                style="margin-top:8px; background:#2563eb; color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px;">
                            Navigate Here
                        </button>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers.push(marker);
            });
        }

        function focusStation(st, cardElement) {
            document.querySelectorAll('.hub-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');
            map.flyTo([st.location.latitude, st.location.longitude], 16);
            const marker = markers.find(m => m.getLatLng().lat === st.location.latitude);
            if(marker) marker.openPopup();
        }

        function toggleFilter(btn, type) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            if(type === 'all') {
                renderList(currentStations);
            } else {
                const filtered = currentStations.slice(0, Math.ceil(currentStations.length / 2));
                renderList(filtered);
            }
        }
    </script>
</body>
</html>
