<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip History</title>
    <!-- Tailwind CSS for styling classes used in history.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../CSS/history.css">
    <style>
        /* Force glass style on trip cards generated by JS */
        #app > div {
            background-color: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05) !important;
            transition: all 0.3s ease;
        }
        #app > div:hover {
            background-color: rgba(255, 255, 255, 0.75) !important;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#F0F4F8] to-[#D9E2EC] text-slate-900 min-h-screen">

    <!-- Top Bar -->
    <header class="sticky top-0 z-30 bg-white/30 backdrop-blur-[20px] border-b border-white/40 shadow-[0_10px_30px_rgba(0,0,0,0.06)]">
        <div class="mx-auto max-w-6xl px-4 py-4 flex items-center gap-3">
            <a href="dashboard.html" class="group -ml-2 flex h-9 w-9 items-center justify-center rounded-full transition hover:bg-white/40">
                <svg class="h-5 w-5 text-black/60 transition group-hover:text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
            </a>
            <div class="w-9 h-9 rounded-2xl border border-white/50 bg-white/40 shadow-sm flex items-center justify-center font-semibold text-gray-700">
                H
            </div>
            <div>
                <div class="font-semibold tracking-tight">History Trip</div>
                <div class="text-xs text-black/60">Reports</div>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <div id="app" class="max-w-6xl mx-auto space-y-4 px-4 py-6"></div>

    <!-- Detail Modal -->
    <dialog id="detailModal" class="rounded-[24px] p-0 backdrop:backdrop-blur-sm open:animate-in open:fade-in open:zoom-in-95 backdrop:animate-in backdrop:fade-in shadow-2xl bg-transparent">
        <div class="w-full max-w-2xl bg-white/80 backdrop-blur-xl border border-white/50 p-6 shadow-[0_20px_40px_-10px_rgba(0,0,0,0.05)]">
            <div class="flex items-center justify-between mb-6">
                <h3 id="modalTitle" class="text-xl font-bold tracking-tight">Trip Details</h3>
                <button id="closeDetailBtn" class="p-2 hover:bg-white/40 rounded-full transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            
            <div id="modalContent" class="space-y-6">
                <!-- Content injected by JS -->
            </div>

            <div class="mt-8 flex gap-3 pt-4 border-t border-white/20">
                <button id="downloadBtn" class="flex-1 rounded-xl bg-gray-900 text-white px-4 py-3 text-sm font-semibold hover:bg-black transition shadow-lg shadow-gray-900/10">
                    Download Report
                </button>
                <button id="deleteOneBtn" class="rounded-xl border border-red-200/60 bg-red-50/50 text-red-600 px-4 py-3 text-sm font-semibold hover:bg-red-100/50 transition">
                    Delete
                </button>
            </div>
        </div>
    </dialog>

    <!-- Confirm Modal -->
    <dialog id="confirmModal" class="rounded-[24px] p-0 backdrop:backdrop-blur-sm shadow-2xl bg-transparent">
        <div class="w-full max-w-sm bg-white/80 backdrop-blur-xl border border-white/50 p-6 text-center shadow-[0_20px_40px_-10px_rgba(0,0,0,0.05)]">
            <div class="mx-auto w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mb-4 text-red-600">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 id="confirmTitle" class="text-lg font-bold text-gray-900">Confirm Action</h3>
            <p id="confirmMessage" class="mt-2 text-sm text-gray-500">Are you sure?</p>
            <div class="mt-6 flex gap-3">
                <button id="cancelConfirmBtn" class="flex-1 rounded-xl border border-gray-200/60 bg-white/50 px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-white/80">Cancel</button>
                <button id="confirmActionBtn" class="flex-1 rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700 shadow-lg shadow-red-600/20">Confirm</button>
                <button id="closeConfirmBtn" class="hidden">Close</button>
            </div>
        </div>
    </dialog>

    <script src="../JS/history.js"></script>
</body>
</html>
