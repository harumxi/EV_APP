<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History Trip Reports</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    dialog::backdrop { background: rgba(0,0,0,.35); }

    input[type="checkbox"]{
      width: 16px; height: 16px;
      border-radius: 4px;
      accent-color: #000;
    }

    input[type="checkbox"].indeterminate {
      background: #000;
    }
    
    /* Dropdown Menu Animation */
    .menu-dropdown { transform-origin: top right; transition: all 0.1s ease-out; }
    .menu-dropdown.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
    .menu-dropdown:not(.hidden) { opacity: 1; transform: scale(1); pointer-events: auto; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-white to-black/5">

  <header class="sticky top-0 z-20 border-b border-black/5 bg-white/70 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 py-4 flex items-center gap-3">
      <a href="dashboard.html" class="w-9 h-9 rounded-2xl border border-black/10 bg-white shadow-sm flex items-center justify-center font-semibold hover:bg-gray-50 transition text-black/70">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="w-9 h-9 rounded-2xl border border-black/10 bg-white shadow-sm flex items-center justify-center font-semibold">
        H
      </div>
      <div>
        <div class="font-semibold tracking-tight">History Trip</div>
        <div class="text-xs text-black/60">Reports</div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6 space-y-4" id="app">
      <div class="text-center py-10 text-black/40">Loading reports...</div>
  </main>

  <dialog id="detailModal" class="rounded-2xl w-full max-w-2xl p-0 border border-black/10">
    <div class="p-4 space-y-4 bg-white/90 backdrop-blur">
      <div class="flex justify-between items-start gap-3">
        <div>
          <h2 class="font-semibold text-lg tracking-tight" id="modalTitle"></h2>
          <div class="text-xs text-black/60">Trip details</div>
        </div>
        <button onclick="closeDetailModal()" class="rounded-2xl border border-black/10 bg-white px-2 py-1 text-black/70" aria-label="Close">
          ✕
        </button>
      </div>

      <div id="modalContent" class="text-sm text-black/70 space-y-3"></div>

      <div class="flex flex-col gap-2 sm:flex-row sm:justify-end">
        <button id="downloadBtn" class="px-4 py-2 rounded-2xl bg-black text-white font-semibold inline-flex items-center justify-center gap-2">
          Download report
        </button>
        <button id="deleteOneBtn" class="px-4 py-2 rounded-2xl border border-black/10 bg-white font-semibold text-black/80 inline-flex items-center justify-center gap-2">
          Delete report
        </button>
      </div>
    </div>
  </dialog>

  <!-- Confirm Modal (reusable) -->
  <dialog id="confirmModal" class="rounded-2xl w-full max-w-lg p-0 border border-black/10">
    <div class="p-4 space-y-4 bg-white/90 backdrop-blur">
      <div class="flex justify-between items-start gap-3">
        <div>
          <div class="font-semibold tracking-tight" id="confirmTitle"></div>
          <div class="mt-1 text-sm text-black/60" id="confirmMessage"></div>
        </div>
        <button onclick="closeConfirmModal()" class="rounded-2xl border border-black/10 bg-white px-2 py-1 text-black/70" aria-label="Close">
          ✕
        </button>
      </div>

      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button onclick="closeConfirmModal()" class="rounded-2xl border border-black/10 bg-white px-4 py-2 text-sm">Cancel</button>
        <button id="confirmActionBtn" class="rounded-2xl bg-black px-4 py-2 text-sm font-semibold text-white">Confirm</button>
      </div>
    </div>
  </dialog>

<script>
  // CONFIGURATION
  const API_BASE = "http://localhost/WEBPROG_PROJ/BACKEND/API";
  const USER_ID = localStorage.getItem("user_id");
  
  let trips = [];
  let activeTrip = null;
  
  // UNIT PREFERENCES
  const PREF_UNIT = localStorage.getItem('pref_units') || 'KM';
  const DIST_FACTOR = PREF_UNIT === 'MILES' ? 0.621371 : 1;
  const DIST_LABEL = PREF_UNIT === 'MILES' ? 'mi' : 'km';

  const app = document.getElementById('app');
  const detailModal = document.getElementById('detailModal');
  const confirmModal = document.getElementById('confirmModal');

  const ICONS = {
    calendar: `<svg class="w-4 h-4 inline-block text-black/70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 7V5M16 7V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.5 9.5H19.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 21h10c2.2 0 3.5-1.3 3.5-3.5V9c0-2.2-1.3-3.5-3.5-3.5H7C4.8 5.5 3.5 6.8 3.5 9v8.5C3.5 19.7 4.8 21 7 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
    route: `<svg class="w-4 h-4 inline-block text-black/70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 18a3 3 0 1 0 0-6a3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8"/><path d="M17 12a3 3 0 1 0 0-6a3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8"/><path d="M9.3 13.2c1.7-1.1 3.7-1.7 6.2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.4 16.9c2.2 1.1 4.6 1.6 7.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    clock: `<svg class="w-4 h-4 inline-block text-black/70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    file: `<svg class="w-4 h-4 inline-block text-black/70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M14 3H8c-2 0-3 1-3 3v12c0 2 1 3 3 3h8c2 0 3-1 3-3V8l-5-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 13h8M8 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
  };

  // --- INITIALIZATION ---
  document.addEventListener("DOMContentLoaded", async () => {
      if(!USER_ID) window.location.href = 'login.html';
      await fetchTrips();
      render();
      
      // Global click listener to close menus
      document.addEventListener('click', () => {
          document.querySelectorAll('[id^="menu-"]').forEach(el => el.classList.add('hidden'));
      });
  });

  async function fetchTrips() {
      try {
          const res = await fetch(`${API_BASE}/BATTERY/logs.php?user_id=${USER_ID}`);
          const data = await res.json();
          
          if(data.ok && data.logs) {
              trips = data.logs.map(log => ({
                  id: log.id,
                  title: `Trip to ${log.destination || 'Unknown'}`,
                  date: log.created_at,
                  from: log.origin || 'Unknown',
                  to: log.destination || 'Unknown',
                  location: (log.destination || '').split(',')[0],
                  distanceKm: parseFloat(log.distance_km),
                  durationMinutes: Math.round(parseFloat(log.distance_km) * 1.5), // Estimate
                  etaMinutes: Math.round(parseFloat(log.distance_km) * 1.5),
                  emissionsSavedKgCO2e: (parseFloat(log.distance_km) * 0.192).toFixed(1),
                  timeSavedMinutes: Math.round(parseFloat(log.distance_km) * 0.5),
                  energyEfficiencyWhPerKm: 160,
                  stops: [],
                  reflections: 'No notes added.',
                  fileName: `report-${log.id}.json`
              }));
          }
      } catch(e) { 
          console.error("Fetch error", e);
          app.innerHTML = `<div class="text-center text-red-500 py-10">Failed to load reports.</div>`;
      }
  }

  function formatDate(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'2-digit' });
  }

  function computeStats(){
    const total = trips.length;
    const emissions = trips.reduce((s,t)=>s+(parseFloat(t.emissionsSavedKgCO2e)||0),0);
    const timeSaved = trips.reduce((s,t)=>s+(t.timeSavedMinutes||0),0);
    const avgEff = trips.length ? Math.round(trips.reduce((s,t)=>s+(t.energyEfficiencyWhPerKm||0),0) / trips.length) : 0;
    return { total, emissions, timeSaved, avgEff };
  }

  function sortedTrips(){
    return trips.slice().sort((a,b)=> (a.date < b.date ? 1 : -1));
  }

  function openConfirm({ title, message, confirmText, onConfirm }){
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    const btn = document.getElementById('confirmActionBtn');
    btn.textContent = confirmText;
    btn.onclick = () => { onConfirm(); closeConfirmModal(); };
    confirmModal.showModal();
  }

  function render(){
    app.innerHTML = `
      <section class="rounded-2xl border border-black/10 bg-white overflow-hidden">
        <div class="grid grid-cols-1 items-center border-b border-black/10 bg-black/5 px-2 py-2">
          <div class="text-xs font-semibold text-black/70">Trip</div>
        </div>

        ${sortedTrips().length ? `
          <div class="divide-y divide-black/10">
            ${sortedTrips().map(t => {
              return `
                <div class="relative group bg-white hover:bg-gray-50 transition">
                  <div class="w-full px-3 py-3 text-left">
                    <div class="flex items-start justify-between gap-3">
                      <div class="flex-1 cursor-pointer" onclick="openDetailModal(${t.id})">
                        <div class="text-sm font-semibold leading-snug">${t.title}</div>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="p-10 text-center text-sm text-black/60">No reports yet.</div>
        `}
      </section>
    `;
  }

  function openDetailModal(id){
    activeTrip = trips.find(t => t.id === id) || null;
    if (!activeTrip) return;

    const batteryPct = Math.max(1, Math.min(100, 100 - Math.round((activeTrip.energyEfficiencyWhPerKm || 0) / 2)));

    document.getElementById('modalTitle').textContent = activeTrip.title;
    document.getElementById('modalContent').innerHTML = `
      <div class="rounded-2xl border border-black/10 bg-black/5 p-4">
        <div class="flex flex-wrap items-center gap-2 text-sm text-black/70">
          <span class="inline-flex items-center gap-1">${ICONS.calendar} <span>${formatDate(activeTrip.date)}</span></span>
          <span class="text-black/30">•</span>
          <span class="inline-flex items-center gap-1">${ICONS.route} <span>${activeTrip.from} → ${activeTrip.to}</span></span>
          <span class="text-black/30">•</span>
          <span class="inline-flex items-center gap-1">${ICONS.clock} <span>~${activeTrip.durationMinutes} min</span></span>
        </div>
      </div>
      <div class="grid gap-3 sm:grid-cols-3">
        <div class="rounded-2xl border border-black/10 bg-white p-3">
          <div class="text-xs text-black/60">Emissions saved</div>
          <div class="mt-1 text-sm font-semibold">${activeTrip.emissionsSavedKgCO2e} kg CO₂e</div>
        </div>
        <div class="rounded-2xl border border-black/10 bg-white p-3">
          <div class="text-xs text-black/60">Time saved</div>
          <div class="mt-1 text-sm font-semibold">${activeTrip.timeSavedMinutes} min</div>
        </div>
        <div class="rounded-2xl border border-black/10 bg-white p-3">
          <div class="text-xs text-black/60">Energy efficiency</div>
          <div class="mt-1 text-sm font-semibold">${Math.round(activeTrip.energyEfficiencyWhPerKm / DIST_FACTOR)} Wh/${DIST_LABEL}</div>
        </div>
      </div>
      <div class="grid gap-3 sm:grid-cols-3">
        <div class="rounded-2xl border border-black/10 bg-white p-3">
          <div class="text-xs text-black/60">Distance</div>
          <div class="mt-1 text-sm font-semibold">${(activeTrip.distanceKm * DIST_FACTOR).toFixed(1)} ${DIST_LABEL}</div>
        </div>
        <div class="rounded-2xl border border-black/10 bg-white p-3">
          <div class="text-xs text-black/60">ETA</div>
          <div class="mt-1 text-sm font-semibold">~${activeTrip.etaMinutes} min</div>
        </div>
        <div class="rounded-2xl border border-black/10 bg-white p-3">
          <div class="text-xs text-black/60">File</div>
          <div class="mt-1 truncate text-sm font-semibold" title="${activeTrip.fileName}">${activeTrip.fileName}</div>
        </div>
      </div>
    `;

    document.getElementById('downloadBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(activeTrip, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = activeTrip.fileName || 'trip-report.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    document.getElementById('deleteOneBtn').onclick = () => {
      openConfirm({
        title: 'Delete this report?',
        message: 'This will permanently remove this report. This action can’t be undone.',
        confirmText: 'Yes, delete',
        onConfirm: () => {
          const idx = trips.findIndex(t => t.id === activeTrip.id);
          if (idx >= 0) trips.splice(idx, 1);
          activeTrip = null;
          closeDetailModal();
          render();
        }
      });
    };

    detailModal.showModal();
  }

  function toggleMenu(id, event) {
      event.stopPropagation();
      document.querySelectorAll('[id^="menu-"]').forEach(el => {
          if (el.id !== `menu-${id}`) el.classList.add('hidden');
      });
      const menu = document.getElementById(`menu-${id}`);
      if (menu) menu.classList.toggle('hidden');
  }

  function downloadTrip(id) {
      const trip = trips.find(t => t.id === id);
      if (!trip) return;
      const blob = new Blob([JSON.stringify(trip, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = trip.fileName || 'trip-report.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
  }

  function deleteTrip(id) {
      openConfirm({
        title: 'Delete this report?',
        message: 'This will permanently remove this report. This action can’t be undone.',
        confirmText: 'Yes, delete',
        onConfirm: () => {
          const idx = trips.findIndex(t => t.id === id);
          if (idx >= 0) trips.splice(idx, 1);
          render();
        }
      });
  }

  function closeDetailModal(){ if (detailModal.open) detailModal.close(); }
  function closeConfirmModal(){ if (confirmModal.open) confirmModal.close(); }

  detailModal.addEventListener('click', (e) => {
    const rect = detailModal.getBoundingClientRect();
    if (!(rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right)) closeDetailModal();
  });

  confirmModal.addEventListener('click', (e) => {
    const rect = confirmModal.getBoundingClientRect();
    if (!(rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right)) closeConfirmModal();
  });
</script>
</body>
</html>
