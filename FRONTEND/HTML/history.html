<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip History</title>

  <!-- Tailwind CSS for styling classes used in history.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../CSS/history.css">
</head>
<body class="bg-gray-50 text-slate-900">

    <!-- Top Bar -->
    <header class="sticky top-0 z-20 border-b border-black/5 bg-white/70 backdrop-blur">
        <div class="mx-auto max-w-6xl px-4 py-4 flex items-center gap-3">
            <a href="dashboard.html" class="group -ml-2 flex h-9 w-9 items-center justify-center rounded-full transition hover:bg-black/5">
                <svg class="h-5 w-5 text-black/60 transition group-hover:text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
            </a>
            <div class="w-9 h-9 rounded-2xl border border-black/10 bg-white shadow-sm flex items-center justify-center font-semibold">
                H
            </div>
            <div>
                <div class="font-semibold tracking-tight">History Trip</div>
                <div class="text-xs text-black/60">Reports</div>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <div id="app" class="max-w-6xl mx-auto space-y-4 px-4 py-6"></div>

    <!-- Detail Modal -->
    <dialog id="detailModal" class="rounded-3xl p-0 backdrop:backdrop-blur-sm open:animate-in open:fade-in open:zoom-in-95 backdrop:animate-in backdrop:fade-in shadow-2xl">
        <div class="w-full max-w-2xl bg-white p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 id="modalTitle" class="text-xl font-bold tracking-tight">Trip Details</h3>
                <button id="closeDetailBtn" class="p-2 hover:bg-black/5 rounded-full transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            
            <div id="modalContent" class="space-y-6">
                <!-- Content injected by JS -->
            </div>

            <div class="mt-8 flex gap-3 pt-4 border-t border-black/10">
                <button id="downloadBtn" class="flex-1 rounded-xl bg-black text-white px-4 py-3 text-sm font-semibold hover:bg-black/90 transition">
                    Download Report
                </button>
                <button id="deleteOneBtn" class="rounded-xl border border-red-200 text-red-600 px-4 py-3 text-sm font-semibold hover:bg-red-50 transition">
                    Delete
                </button>
            </div>
        </div>
    </dialog>

    <!-- Confirm Modal -->
    <dialog id="confirmModal" class="rounded-3xl p-0 backdrop:backdrop-blur-sm shadow-2xl">
        <div class="w-full max-w-sm bg-white p-6 text-center">
            <div class="mx-auto w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mb-4 text-red-600">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 id="confirmTitle" class="text-lg font-bold text-gray-900">Confirm Action</h3>
            <p id="confirmMessage" class="mt-2 text-sm text-gray-500">Are you sure?</p>
            <div class="mt-6 flex gap-3">
                <button id="cancelConfirmBtn" class="flex-1 rounded-xl border border-gray-200 px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50">Cancel</button>
                <button id="confirmActionBtn" class="flex-1 rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700">Confirm</button>
                <button id="closeConfirmBtn" class="hidden">Close</button>
            </div>
        </div>
    </dialog>

    <script src="../JS/history.js"></script>
</body>
</html>
