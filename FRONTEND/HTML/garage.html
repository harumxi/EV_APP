<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Garage</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        
        .car-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.2s ease; border: 2px solid transparent;
            position: relative;
        }
        .car-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .car-card.active-car { border-color: #22c55e; background: #f0fdf4; }

        .search-wrap { position: relative; max-width: 600px; margin: 0 auto; }
        .search-input {
            width: 100%; padding: 16px 24px; padding-left: 50px;
            border-radius: 99px; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            font-size: 16px; outline: none; transition: 0.2s;
        }
        .search-input:focus { box-shadow: 0 8px 25px rgba(37,99,235,0.2); }

        .modal-bg { background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        
        .btn-delete {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.9); color: #ef4444;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer;
            transition: 0.2s; z-index: 10;
        }
        .btn-delete:hover { background: #ef4444; color: white; }
    </style>
</head>
<body class="pb-20">

    <div class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-warehouse text-blue-600"></i> My Garage
            </h1>
            <a href="trip_planner.html" class="text-gray-500 hover:text-blue-600 font-bold text-sm">
                <i class="fa-solid fa-map"></i> Go to Planner
            </a>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-8">
        
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Find Your EV</h2>
            <p class="text-gray-500 mb-6">Search our database to add cars to your garage.</p>
            
            <div class="search-wrap">
                <i class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="car-search" class="search-input" placeholder="e.g. Tesla, BYD, Nissan..." oninput="handleSearch(this.value)">
                <div id="search-results" class="absolute w-full bg-white mt-2 rounded-2xl shadow-2xl overflow-hidden hidden z-50 text-left"></div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-gray-800">Your Vehicles</h3>
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold" id="car-count">0 Cars</span>
        </div>

        <div id="garage-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <div id="spec-modal" class="fixed inset-0 modal-bg hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl relative animate-bounce-in">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/50 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-times"></i>
            </button>
            
            <div class="w-full h-64 bg-gray-100 relative">
                 <img id="modal-img" src="" class="w-full h-full object-cover">
            </div>

            <div class="p-8">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <div class="text-sm font-bold text-blue-600 uppercase tracking-wider" id="modal-brand">--</div>
                        <h2 class="text-3xl font-black text-gray-900 leading-none" id="modal-model">--</h2>
                    </div>
                    <div class="bg-gray-100 px-3 py-1 rounded-lg font-bold text-gray-600" id="modal-year">--</div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-blue-50 p-4 rounded-xl">
                        <div class="text-xs text-blue-500 font-bold uppercase">Official Range</div>
                        <div class="text-2xl font-black text-gray-900"><span id="modal-range">--</span> <span class="text-sm">km</span></div>
                    </div>
                    <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                        <div class="text-xs text-yellow-600 font-bold uppercase flex items-center gap-1">
                            <i class="fa-solid fa-leaf"></i> Real World
                        </div>
                        <div class="text-2xl font-black text-gray-900"><span id="modal-real-range">--</span> <span class="text-sm">km</span></div>
                    </div>
                    <div class="bg-green-50 p-4 rounded-xl">
                        <div class="text-xs text-green-500 font-bold uppercase">Battery</div>
                        <div class="text-2xl font-black text-gray-900"><span id="modal-batt">--</span> <span class="text-sm">kWh</span></div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-xl">
                        <div class="text-xs text-purple-500 font-bold uppercase">Plug Type</div>
                        <div class="text-lg font-bold text-gray-900 truncate" id="modal-plug">--</div>
                    </div>
                </div>

                <button id="btn-activate" class="w-full mt-6 py-4 bg-gray-900 hover:bg-black text-white rounded-xl font-bold text-lg shadow-lg transition flex justify-center gap-2 items-center">
                    Set as Active Car
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/API/GARAGE/vehicles.php";
        const FALLBACK_IMG = "https://placehold.co/600x400/EEE/31343C?text=EV+Image";
        let searchTimeout;

        document.addEventListener("DOMContentLoaded", () => renderGarage());

        function handleSearch(query) {
            clearTimeout(searchTimeout);
            const dropdown = document.getElementById('search-results');
            
            if(query.length < 2) {
                dropdown.classList.add('hidden');
                return;
            }

            dropdown.innerHTML = '<div class="p-4 text-center text-gray-500"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching...</div>';
            dropdown.classList.remove('hidden');

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${API_URL}?q=${encodeURIComponent(query)}`);
                    const json = await res.json();
                    
                    dropdown.innerHTML = ''; 
                    const cars = Array.isArray(json) ? json : (json.data || []);

                    if(cars.length > 0) {
                        cars.forEach(car => {
                            const div = document.createElement('div');
                            div.className = "p-4 border-b hover:bg-gray-50 cursor-pointer flex items-center gap-4 transition";
                            div.innerHTML = `
                                <img src="${car.image}" onerror="this.src='${FALLBACK_IMG}'" class="w-12 h-12 rounded-lg object-cover bg-gray-200">
                                <div>
                                    <div class="font-bold text-gray-900">${car.brand} ${car.model}</div>
                                    <div class="text-xs text-gray-500">${car.year} • ${car.range_km} km</div>
                                </div>
                                <div class="ml-auto text-blue-600 font-bold text-sm">Add +</div>
                            `;
                            div.onclick = () => addToGarage(car);
                            dropdown.appendChild(div);
                        });
                    } else {
                        dropdown.innerHTML = `<div class="p-4 text-gray-400 text-center">No vehicles found.</div>`;
                    }
                } catch(e) {
                    console.error("Search Error", e);
                    dropdown.innerHTML = '<div class="p-4 text-red-500 text-center">Connection Error.</div>';
                }
            }, 300);
        }

        function addToGarage(car) {
            let garage = JSON.parse(localStorage.getItem('my_garage') || "[]");
            if(garage.some(c => c.id === car.id)) {
                alert("Car already in garage!");
                return;
            }
            garage.push(car);
            localStorage.setItem('my_garage', JSON.stringify(garage));
            
            if(garage.length === 1) setActiveCar(car);

            document.getElementById('search-results').classList.add('hidden');
            document.getElementById('car-search').value = '';
            renderGarage();
        }

        function removeFromGarage(carId) {
            if(!confirm("Remove this car?")) return;
            let garage = JSON.parse(localStorage.getItem('my_garage') || "[]");
            let activeCar = JSON.parse(localStorage.getItem('active_car') || "null");

            if (activeCar && activeCar.id === carId) {
                alert("Cannot delete active car. Switch first.");
                return;
            }
            garage = garage.filter(c => c.id !== carId);
            localStorage.setItem('my_garage', JSON.stringify(garage));
            renderGarage();
        }

        function renderGarage() {
            const garage = JSON.parse(localStorage.getItem('my_garage') || "[]");
            const activeCar = JSON.parse(localStorage.getItem('active_car') || "null");
            const grid = document.getElementById('garage-grid');
            
            document.getElementById('car-count').innerText = `${garage.length} Cars`;

            if(garage.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400">Your garage is empty.</div>`;
                return;
            }

            grid.innerHTML = '';
            garage.forEach(car => {
                const isActive = activeCar && activeCar.id === car.id;
                const div = document.createElement('div');
                div.className = `car-card ${isActive ? 'active-car' : ''}`;
                
                div.innerHTML = `
                    <div class="btn-delete" onclick="event.stopPropagation(); removeFromGarage('${car.id}')"><i class="fa-solid fa-trash"></i></div>
                    <div class="relative h-48 bg-gray-100">
                        <img src="${car.image}" onerror="this.src='${FALLBACK_IMG}'" class="w-full h-full object-cover">
                        ${isActive ? '<div class="absolute top-4 right-4 bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg"><i class="fa-solid fa-check"></i> Active</div>' : ''}
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <div class="text-xs font-bold text-gray-400 uppercase">${car.brand}</div>
                                <h3 class="text-xl font-black text-gray-900">${car.model}</h3>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold text-gray-900">${car.range_km}</div>
                                <div class="text-xs text-gray-500 font-bold uppercase">km Range</div>
                            </div>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <button onclick='openSpecModal(${JSON.stringify(car).replace(/'/g, "&#39;")})' class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold text-gray-700 text-sm transition">Specs</button>
                            ${!isActive ? `<button onclick='setActiveCar(${JSON.stringify(car).replace(/'/g, "&#39;")})' class="flex-1 py-3 bg-gray-900 hover:bg-black text-white rounded-xl font-bold text-sm transition">Activate</button>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        // --- THE CRITICAL "CALCULATED PROPERLY" PART ---
        function setActiveCar(car) {
            // 1. Save Full Object
            localStorage.setItem('active_car', JSON.stringify(car));
            
            // 2. Save Specific Calculation Metrics
            localStorage.setItem('ev_capacity', car.battery_kwh);
            localStorage.setItem('ev_efficiency', car.efficiency_whkm);
            
            // 3. Save RANGES (Official vs Real World)
            // Use real_world_range from backend if available, otherwise 85% of official
            const safeRange = car.real_world_range_km || Math.round(car.range_km * 0.85);
            
            localStorage.setItem('ev_max_range', car.range_km);
            localStorage.setItem('ev_safe_range', safeRange); 

            // 4. Update UI
            renderGarage();
            
            // Close Modal if open
            if(!document.getElementById('spec-modal').classList.contains('hidden')) {
                closeModal();
                setTimeout(() => openSpecModal(car), 100); // Re-open to update button
            }
        }

        function openSpecModal(car) {
            const modal = document.getElementById('spec-modal');
            const activeCar = JSON.parse(localStorage.getItem('active_car') || "null");
            const isActive = activeCar && activeCar.id === car.id;

            const imgEl = document.getElementById('modal-img');
            imgEl.src = car.image;
            imgEl.onerror = function() { this.src = FALLBACK_IMG; };

            document.getElementById('modal-brand').innerText = car.brand;
            document.getElementById('modal-model').innerText = car.model;
            document.getElementById('modal-year').innerText = car.year;
            document.getElementById('modal-range').innerText = car.range_km;
            
            // SHOW CALCULATED REAL WORLD RANGE
            const realRange = car.real_world_range_km || Math.round(car.range_km * 0.85);
            document.getElementById('modal-real-range').innerText = realRange;
            
            document.getElementById('modal-batt').innerText = car.battery_kwh;
            document.getElementById('modal-plug').innerText = car.plug_type;

            const btn = document.getElementById('btn-activate');
            if(isActive) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Currently Active';
                btn.className = "w-full mt-6 py-4 bg-green-600 text-white rounded-xl font-bold text-lg shadow-lg cursor-default";
                btn.onclick = null;
            } else {
                btn.innerHTML = 'Set as Active Car';
                btn.className = "w-full mt-6 py-4 bg-gray-900 hover:bg-black text-white rounded-xl font-bold text-lg shadow-lg transition";
                btn.onclick = () => { setActiveCar(car); closeModal(); };
            }
            modal.classList.remove('hidden');
        }

        function closeModal() { document.getElementById('spec-modal').classList.add('hidden'); }
        document.getElementById('spec-modal').addEventListener('click', (e) => {
            if(e.target.id === 'spec-modal') closeModal();
        });
    </script>
</body>
</html>
