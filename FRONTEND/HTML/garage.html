<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Garage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .car-card { transition: all 0.2s; }
        .car-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .active-ring { ring: 4px solid #16a34a; background: #f0fdf4; }
        
        /* Modal Animation */
        .modal { opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal.open { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative pb-24">
    
    <div class="bg-gray-900 text-white p-6 rounded-b-3xl shadow-lg relative">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-black tracking-tighter">My Garage 🚗</h1>
            <div class="flex gap-2">
                <button onclick="openSearch()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1">
                    <span class="text-lg">+</span> Add Car
                </button>
                <button onclick="logout()" class="text-xs font-bold bg-red-600 px-3 py-1 rounded-full hover:bg-red-700">Logout</button>
            </div>
        </div>
        <p class="text-gray-400 text-sm">Select the vehicle you want to use for your trip.</p>
    </div>

    <div id="carList" class="p-6 space-y-4">
        <div class="text-center text-gray-500 mt-10">Loading garage...</div>
    </div>

    <div id="plannerBtnWrap" class="fixed bottom-6 left-0 right-0 px-6 hidden z-40">
        <button onclick="window.location.href='trip_planner.html'" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-xl text-lg flex items-center justify-center gap-2 animate-bounce">
            Plan Trip with Active Car ➜
        </button>
    </div>

    <div id="searchModal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-800">Add New Vehicle</h3>
                <button onclick="closeSearch()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <div class="p-4 space-y-4">
                <div>
                    <input id="searchInput" type="text" placeholder="e.g. Tesla Model 3" 
                           class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="searchCar()" id="findBtn"
                        class="w-full bg-black text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition">
                    Find Car
                </button>
                
                <div id="searchResults" class="max-h-60 overflow-y-auto space-y-2 pt-2">
                    </div>
            </div>
        </div>
    </div>

</div>

<script>
    // CONFIG
    const BASE_API = "http://localhost/WEBPROG_PROJ/BACKEND/API";
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");

    if (!currentUser) window.location.href = "login.html";

    // --- 1. Load Garage ---
    async function loadGarage() {
        try {
            const res = await fetch(`${BASE_API}/GARAGE/get_user_garage.php?user_id=${currentUser.id}`);
            const data = await res.json();
            
            const list = document.getElementById("carList");
            list.innerHTML = "";

            if (!data.ok || !data.garage || data.garage.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 font-bold mt-10">Garage is empty.<br>Tap "+ Add Car" to start!</div>`;
                return;
            }

            let hasActive = false;

            data.garage.forEach(car => {
                const isActive = (car.is_active == 1);
                if(isActive) hasActive = true;

                const card = document.createElement("div");
                card.className = `car-card border rounded-2xl p-4 flex justify-between items-center cursor-pointer ${isActive ? 'active-ring border-green-500' : 'border-gray-200 bg-white'}`;
                
                if(!isActive) card.onclick = () => setActive(car.garage_id);

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-3xl">${isActive ? '🚘' : '🚗'}</div>
                        <div>
                            <div class="font-black text-gray-900 text-lg">${car.nickname || car.model}</div>
                            <div class="text-xs text-gray-500 font-bold">${car.brand} ${car.model}</div>
                            <div class="text-[10px] text-gray-400 mt-1">Eff: ${car.efficiency_wh_per_km} Wh/km</div>
                        </div>
                    </div>
                    <div>
                        ${isActive 
                            ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-black tracking-wide">ACTIVE</span>` 
                            : `<button onclick="event.stopPropagation(); setActive(${car.garage_id})" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl text-xs font-bold transition">Select</button>`
                        }
                    </div>
                `;
                list.appendChild(card);
            });

            const btn = document.getElementById("plannerBtnWrap");
            if(hasActive) btn.classList.remove("hidden");
            else btn.classList.add("hidden");

        } catch (err) {
            document.getElementById("carList").innerHTML = `<div class="text-red-500 text-center">Error loading garage.</div>`;
        }
    }

    // --- 2. Set Active ---
    async function setActive(garageId) {
        await fetch(`${BASE_API}/GARAGE/set_active.php`, {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ user_id: currentUser.id, garage_id: garageId })
        });
        loadGarage();
    }

    // --- 3. Search & Add Car ---
    function openSearch() { document.getElementById("searchModal").classList.add("open"); }
    function closeSearch() { document.getElementById("searchModal").classList.remove("open"); }

    async function searchCar() {
        const q = document.getElementById("searchInput").value.trim();
        const resultsBox = document.getElementById("searchResults");
        const btn = document.getElementById("findBtn");

        if(!q) return alert("Enter a car name");
        
        btn.disabled = true; btn.innerText = "Searching...";
        resultsBox.innerHTML = '<div class="text-center text-gray-400 text-sm">Searching API...</div>';

        try {
            // Re-using your existing garage_search.php
            const res = await fetch(`${BASE_API}/GARAGE/garage_search.php`, {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ search: q })
            });
            const data = await res.json();
            
            resultsBox.innerHTML = "";
            const items = data.results || [];

            if(items.length === 0) {
                resultsBox.innerHTML = '<div class="text-center text-red-400 text-sm">No results found. Try "Tesla"</div>';
                return;
            }

            items.slice(0, 5).forEach(car => {
                const row = document.createElement("div");
                row.className = "flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100";
                row.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${car.make} ${car.model}</div>
                        <div class="text-xs text-gray-500">${car.variant || 'Standard'} • ${car.battery_kwh} kWh</div>
                    </div>
                    <button class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-blue-700">Add</button>
                `;
                // Click Add
                row.querySelector("button").onclick = () => addCar(car);
                resultsBox.appendChild(row);
            });

        } catch(e) {
            resultsBox.innerHTML = '<div class="text-center text-red-500 text-sm">Search failed.</div>';
        } finally {
            btn.disabled = false; btn.innerText = "Find Car";
        }
    }

    async function addCar(car) {
        const nickname = prompt(`Nickname for your ${car.model}?`, car.model) || car.model;
        
        try {
            // Re-using your existing add.php
            const res = await fetch(`${BASE_API}/GARAGE/add.php`, {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    user_id: currentUser.id,
                    make: car.make, model: car.model, variant: car.variant,
                    battery_kwh: car.battery_kwh, eff_wh_km: car.eff_wh_km,
                    drive_mode: car.drive_mode, nickname: nickname
                })
            });
            const data = await res.json();
            
            if(data.ok) {
                closeSearch();
                document.getElementById("searchInput").value = "";
                document.getElementById("searchResults").innerHTML = "";
                loadGarage(); // Refresh list to show new car
            } else {
                alert("Error adding car: " + (data.error || "Unknown error"));
            }
        } catch(e) {
            alert("Failed to add car.");
        }
    }

    function logout() {
        localStorage.removeItem("currentUser");
        window.location.href = "login.html";
    }

    loadGarage();
</script>
</body>
</html>
