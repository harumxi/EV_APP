<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Garage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .car-card { transition: all 0.2s; }
        .car-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .active-ring { ring: 4px solid #16a34a; background: #f0fdf4; }
        .modal { opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal.open { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative pb-24">
    
    <div class="bg-gray-900 text-white p-6 rounded-b-3xl shadow-lg relative">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-black tracking-tighter">My Garage 🚗</h1>
            <div class="flex gap-2">
                <button onclick="openSearch()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1">
                    <span class="text-lg">+</span> Add Car
                </button>
                <button onclick="logout()" class="text-xs font-bold bg-red-600 px-3 py-1 rounded-full hover:bg-red-700">Logout</button>
            </div>
        </div>
        <p class="text-gray-400 text-sm" id="who">Loading user...</p>
    </div>

    <div id="carList" class="p-6 space-y-4">
        <div class="text-center text-gray-500 mt-10">Loading garage...</div>
    </div>

    <div id="plannerBtnWrap" class="fixed bottom-6 left-0 right-0 px-6 hidden z-40">
        <button onclick="window.location.href='trip_planner.html'" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-xl shadow-xl text-lg flex items-center justify-center gap-2 animate-bounce">
            Plan Trip with Active Car ➜
        </button>
    </div>

    <div id="searchModal" class="modal fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-800">Add New Vehicle</h3>
                <button onclick="closeSearch()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <div class="p-4 space-y-4">
                <div>
                    <input id="searchInput" type="text" placeholder="e.g. Tesla Model 3" 
                           class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="searchCar()" id="findBtn"
                        class="w-full bg-black text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition">
                    Find Car
                </button>
                
                <div id="searchResults" class="max-h-60 overflow-y-auto space-y-2 pt-2"></div>
            </div>
        </div>
    </div>

</div>

<script>
    // ✅ 1. CONFIG (Same logic as your working test_garage)
    const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/api/GARAGE";
    const user = JSON.parse(localStorage.getItem("currentUser") || "null");

    if (!user || !user.id) window.location.href = "login.html";
    document.getElementById("who").innerText = "Logged in as: " + user.email;
    const USER_ID = user.id;

    // ✅ 2. HELPER (Same as your working code)
    async function postJSON(url, payload) {
        const res = await fetch(url, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { console.error("Bad JSON", text); throw new Error("Server Error"); }
        if (!res.ok) throw new Error(data.error || "HTTP Error");
        return data;
    }

    // ✅ 3. LOAD GARAGE (Uses your working list.php)
    async function loadGarage() {
        const list = document.getElementById("carList");
        list.innerHTML = `<div class="text-center text-gray-400">Loading...</div>`;
        
        try {
            // Using list.php since you confirmed it works
            const data = await postJSON(`${API_URL}/list.php`, { user_id: USER_ID });
            list.innerHTML = "";

            if (!data.cars || data.cars.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 font-bold mt-10">Garage is empty.<br>Tap "+ Add Car" to start!</div>`;
                return;
            }

            let hasActive = false;

            data.cars.forEach(car => {
                const isActive = Number(car.is_active) === 1;
                if (isActive) hasActive = true;
                
                const label = `${car.brand_name} ${car.model_name} ${car.variant_name || ""}`.trim();

                const card = document.createElement("div");
                card.className = `car-card border rounded-2xl p-4 flex justify-between items-center cursor-pointer ${isActive ? 'active-ring border-green-500' : 'border-gray-200 bg-white'}`;
                
                // If not active, clicking selects it
                if (!isActive) card.onclick = () => setActive(car.garage_id);

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-3xl">${isActive ? '🚘' : '🚗'}</div>
                        <div>
                            <div class="font-black text-gray-900 text-lg">${label}</div>
                            <div class="text-xs text-gray-500 font-bold">${car.battery_capacity_kwh} kWh • ${car.efficiency_wh_per_km} Wh/km</div>
                            ${car.nickname ? `<div class="text-[10px] text-gray-400 mt-1">"${car.nickname}"</div>` : ""}
                        </div>
                    </div>
                    <div>
                        ${isActive 
                            ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-black tracking-wide">ACTIVE</span>` 
                            : `<button onclick="event.stopPropagation(); setActive(${car.garage_id})" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl text-xs font-bold transition">Select</button>`
                        }
                    </div>
                `;
                
                // Add Delete Button (Small X)
                const delBtn = document.createElement("button");
                delBtn.className = "absolute top-2 right-2 text-gray-300 hover:text-red-500 font-bold px-2";
                delBtn.innerHTML = "&times;";
                delBtn.onclick = (e) => { e.stopPropagation(); removeCar(car.garage_id); };
                // card.appendChild(delBtn); // Uncomment if you want delete button on card

                list.appendChild(card);
            });

            // SHOW/HIDE PLAN TRIP BUTTON
            const btn = document.getElementById("plannerBtnWrap");
            if (hasActive) btn.classList.remove("hidden");
            else btn.classList.add("hidden");

        } catch (e) {
            console.error(e);
            list.innerHTML = `<div class="text-red-500 text-center">Error loading garage.</div>`;
        }
    }

    // ✅ 4. SEARCH (Uses your working garage_search.php)
    async function searchCar() {
        const q = document.getElementById("searchInput").value.trim();
        const results = document.getElementById("searchResults");
        const btn = document.getElementById("findBtn");

        if (!q) return;

        btn.disabled = true; btn.innerText = "Searching...";
        results.innerHTML = "";

        try {
            const data = await postJSON(`${API_URL}/garage_search.php`, { search: q });

            if (!data.results || data.results.length === 0) {
                results.innerHTML = `<div class="text-center text-gray-500 text-sm">No results.</div>`;
                return;
            }

            data.results.slice(0, 5).forEach(r => {
                const label = `${r.brand_name} ${r.model_name} ${r.variant_name || ""}`.trim();
                const div = document.createElement("div");
                div.className = "flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100";
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${label}</div>
                        <div class="text-xs text-gray-500">${r.battery_capacity_kwh} kWh</div>
                    </div>
                    <button class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-blue-700">Add</button>
                `;
                div.querySelector("button").onclick = () => addCar(r.variant_id);
                results.appendChild(div);
            });
        } catch (e) {
            results.innerHTML = `<div class="text-red-500 text-sm">Search failed.</div>`;
        } finally {
            btn.disabled = false; btn.innerText = "Find Car";
        }
    }

    // ✅ 5. ADD CAR (Uses your working logic: variant_id)
    async function addCar(variantId) {
        const nickname = prompt("Nickname (optional):") || "";
        try {
            await postJSON(`${API_URL}/add.php`, { user_id: USER_ID, variant_id: Number(variantId), nickname });
            closeSearch();
            document.getElementById("searchInput").value = "";
            document.getElementById("searchResults").innerHTML = "";
            loadGarage();
        } catch (e) {
            alert(e.message);
        }
    }

    // ✅ 6. SET ACTIVE & REDIRECT BUTTON Logic
    async function setActive(garageId) {
        try {
            await postJSON(`${API_URL}/set_active.php`, { user_id: USER_ID, garage_id: Number(garageId) });
            loadGarage();
        } catch (e) {
            alert(e.message);
        }
    }

    async function removeCar(garageId) {
        if (!confirm("Delete this vehicle?")) return;
        try {
            await postJSON(`${API_URL}/remove.php`, { user_id: USER_ID, garage_id: Number(garageId) });
            loadGarage();
        } catch (e) {
            alert(e.message);
        }
    }

    // Modal UI
    function openSearch() { document.getElementById("searchModal").classList.add("open"); }
    function closeSearch() { document.getElementById("searchModal").classList.remove("open"); }
    function logout() { localStorage.removeItem("currentUser"); window.location.href = "login.html"; }

    // Init
    loadGarage();
</script>
</body>
</html>
