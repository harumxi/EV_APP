<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Garage Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../UI_CSS/garage.css">
</head>
<body class="min-h-screen bg-white">
    <div class="max-w-6xl mx-auto p-8">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-light text-gray-800">
                Your <span class="font-semibold">Garage</span>
            </h1>
            
            <button id="addCarBtn" class="flex items-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add a Car
            </button>
        </div>

        <div id="vehicleGrid" class="space-y-4"></div>

        <div id="emptyState" class="text-center py-20 hidden">
            <svg class="mx-auto text-gray-300 mb-4" width="64" height="64" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
            </svg>
            <h3 class="text-2xl text-gray-400 mb-2">No vehicles yet</h3>
            <p class="text-gray-500">Add your first EV to get started</p>
        </div>
    </div>

    <div id="addModal" class="modal">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">Add New Vehicle</h2>
                <button id="closeAddModal" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Car Owner Name *</label>
                    <input type="text" id="ownerName" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="Enter owner name">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Type of EV *</label>
                    <select id="brandSelect" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                        <option value="">Select brand</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Model of the Car *</label>
                    <select id="modelSelect" disabled class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all disabled:bg-gray-100 disabled:cursor-not-allowed">
                        <option value="">Select brand first</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-4">
                    <button id="cancelAdd" class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                        Cancel
                    </button>
                    <button id="confirmAdd" class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium shadow-lg">
                        Add Vehicle
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl mx-4">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Delete Vehicle?</h3>
                <p class="text-gray-600 mb-6">Are you sure you want to remove this vehicle from your garage? This action cannot be undone.</p>
                <div class="flex gap-3">
                    <button id="cancelDelete" class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                        Cancel
                    </button>
                    <button id="confirmDelete" class="flex-1 px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium shadow-lg">
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../UI_JS/garage.js"></script>
</body>
</html>
