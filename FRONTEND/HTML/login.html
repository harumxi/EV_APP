<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnerGo - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <div class="success-message" id="successMessage" role="alert">Welcome to EnerGo!</div>

    <div class="main-container">
        <div class="left-panel">
            <div class="logo">
                <div class="logo-icon" aria-hidden="true">⚡</div>
                EnerGo
            </div>
            
            <div class="form-container">
                <div class="form-panel" id="loginForm">
                    <div class="welcome-section">
                        <h1 class="welcome-title">Welcome</h1>
                        <p class="welcome-subtitle">Power your journey with smart energy management. Connect to a sustainable future.</p>
                    </div>

                    <form id="loginFormElement">
                        <div class="input-group">
                            <label class="input-label" for="loginEmail">EMAIL</label>
                            <div class="input-wrapper">
                                <input type="email" class="input-field" id="loginEmail" name="email" 
                                       placeholder="Enter your email" title="Please enter your registered email" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="input-label" for="loginPassword">PASSWORD</label>
                            <div class="input-wrapper">
                                <input type="password" class="input-field" id="loginPassword" name="password" 
                                       placeholder="Enter your password" title="Please enter your password" required>
                                <span class="password-toggle" onclick="togglePassword('loginPassword', this)" role="button" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </span>
                            </div>
                            <div class="forgot-password">
                                <a href="javascript:void(0)" onclick="handleForgotPassword()">Forgot Password?</a>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">
                            <span>LOGIN</span> <span class="arrow">→</span>
                        </button>
                    </form>

                    <div class="toggle-form">
                        Don't have an account? <a href="javascript:void(0)" onclick="showSignup()">Create an Account</a>
                    </div>
                </div>

                <div class="form-panel hidden" id="signupForm">
                    <div class="welcome-section">
                        <h1 class="welcome-title">Join EnerGo</h1>
                        <p class="welcome-subtitle">Start your journey toward smart, sustainable energy management today.</p>
                    </div>
                    <form id="signupFormElement">
                        <div class="input-group">
                            <label class="input-label" for="signupName">FULL NAME</label>
                            <input type="text" class="input-field" id="signupName" placeholder="Your Name" title="Enter your full name" required>
                        </div>
                        <div class="input-group">
                            <label class="input-label" for="signupEmail">EMAIL ADDRESS</label>
                            <input type="email" class="input-field" id="signupEmail" placeholder="Email Address" title="Enter a valid email address" required>
                        </div>
                        <div class="input-group">
                            <label class="input-label" for="signupPassword">STRICT PASSWORD</label>
                            <input type="password" class="input-field" id="signupPassword" placeholder="8+ chars, Uppercase, Number, Symbol" title="Password must be at least 8 characters with uppercase, number, and symbol" required>
                        </div>
                        <div class="input-group">
                            <label class="input-label" for="confirmPassword">CONFIRM PASSWORD</label>
                            <input type="password" class="input-field" id="confirmPassword" placeholder="Confirm Password" title="Re-type your password" required>
                        </div>
                        <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
                    </form>
                    <div class="toggle-form">
                        Already have an account? <a href="javascript:void(0)" onclick="showLogin()">Login</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <img src="../bg.jpg" class="bg-image" alt="Futuristic city background" title="Cityscape Background">
            <div class="car-container">
                <img src="../car.png" class="car-image" alt="Electric vehicle" title="Electric Vehicle Display">
            </div>
        </div>
    </div>

    <script src="../JS/login.js"></script>
</body>
</html>
